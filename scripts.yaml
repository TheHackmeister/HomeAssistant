sensors_create_plants:
  alias: 'Sensors: Create Plants'
  description: Dynamically create plant monitoring sensors via MQTT discovery
  mode: queued
  max: 10
  fields:
    plants_to_create:
      name: Number of Plants
      description: How many plant sensors to create
      default: 1
      selector:
        number:
          min: 1
          max: 100
    variety:
      name: Plant Variety
      description: Plant variety/type
      default: plant
      selector:
        text:
    source:
      name: Source
      description: Where the plant came from
      selector:
        text:
    started_at:
      name: Started Date/Time
      description: When the plant was planted (defaults to now)
      selector:
        datetime:
    plant_area:
      name: Plant Area
      description: Area to put plant in
      selector:
        area:
          entity:
            device_class: pressure
    starting_id:
      name: Starting ID Override
      description: Optional override for the starting plant ID number
      selector:
        number:
          min: 0
          max: 10000
    location_id:
      selector:
        number:
          min: 1
          max: 1000
          step: 1
      name: Location ID
      description: Starting Location ID to use
  sequence:
  - variables:
      ha_topic: homeassistant
      counter_topic: plants/next_plant_id
      current_id: "{% if starting_id is defined and starting_id is not none %}\n  {{
        starting_id | int }}\n{% elif states('number.next_plant_id') not in ['unknown',
        'unavailable', 'none'] %}\n  {{ states('number.next_plant_id') | int }}\n{%
        else %}\n  0\n{% endif %}\n"
      needs_counter_creation: "{{ states('number.next_plant_id') in ['unknown', 'unavailable',
        'none'] \n    and (starting_id is not defined or starting_id is none) }}\n"
      started_at: '{{ started_at if (started_at is defined and started_at is not none)
        else now().isoformat() }}'
  - if:
    - condition: template
      value_template: '{{ needs_counter_creation }}'
    then:
    - data:
        topic: '{{ ha_topic }}/number/plant_tracking/next_plant_id/config'
        retain: true
        payload: "{\n  \"name\": \"Next Plant ID\",\n  \"unique_id\": \"next_plant_id_counter\",\n
          \ \"object_id\": \"next_plant_id\",\n  \"state_topic\": \"{{ counter_topic
          }}\",\n  \"command_topic\": \"{{ counter_topic }}\",\n  \"min\": 0,\n  \"max\":
          100000,\n  \"step\": 1,\n  \"mode\": \"box\",\n  \"retain\": true,\n  \"device\":
          {\n    \"identifiers\": [\"plant_tracking\"],\n    \"name\": \"Plant Tracking\",\n
          \   \"manufacturer\": \"Curated Forest\"\n  }\n}\n"
      action: mqtt.publish
    - data:
        topic: '{{ counter_topic }}'
        retain: true
        payload: '0'
      action: mqtt.publish
    - delay:
        milliseconds: 500
  - repeat:
      count: '{{ plants_to_create | int }}'
      sequence:
      - variables:
          plant_number: '{{ current_id | int + repeat.index - 1 }}'
          plant_id: '{{ variety | default(''plant'') | lower | replace('' '', ''_'')
            }}_{{ plant_number }}'
          device_name: plant_id_{{ plant_id }}
          plant_topic: plants/{{ plant_id }}
      - data:
          topic: '{{ ha_topic }}/sensor/{{ device_name }}/status/config'
          retain: true
          payload: "{{ {\n  \"name\": \"Growing For\",\n  \"unique_id\": device_name
            ~ \"_grow_days\",\n  \"default_entity_id\": \"sensor.\" ~ device_name,\n
            \ \"state_topic\": \"plants/update_every_hour\",\n  \"value_template\":
            \"{{ ((as_timestamp(now()) - as_timestamp(state_attr('sensor.\" ~ device_name
            ~ \"', 'started_at') | default(now(), true))) / 3600 / 24) | round(1)
            }}\",\n  \"unit_of_measurement\": \"d\",\n  \"device_class\": \"duration\",\n
            \ \"state_class\": \"measurement\",\n  \"json_attributes_topic\": plant_topic
            ~ \"/attributes\",\n  \"device\": {\n    \"identifiers\": [device_name],\n
            \   \"name\": (variety | default('Plant') | replace('_', ' ') | title)
            ~ ' #' ~ plant_number,\n    \"manufacturer\": \"Curated Forest\",\n    \"suggested_area\":
            area_name(plant_area),\n    \"model\": \"Plant Tracking\"\n  }\n} | to_json
            }}\n"
        action: mqtt.publish
      - data:
          topic: '{{ plant_topic }}/attributes'
          retain: true
          payload: "{{ {\n  'location_entity_id': (\"switch.location_id_\" ~ ((location_id
            + repeat.index -1) | string)) if (location_id is defined and location_id)
            else '',\n  'plant_id': plant_id,\n  'variety': variety | default(''),\n
            \ 'source': source | default(''),\n  'started_at': started_at\n} | to_json
            }}\n"
        action: mqtt.publish
      - data:
          topic: '{{ ha_topic }}/sensor/{{ device_name }}_records/status/config'
          retain: true
          payload: "{{ {\n  \"name\": \"Records\",\n  \"unique_id\": \"plant_records_\"
            ~ plant_id,\n  \"default_entity_id\": \"sensor.plant_records_\" ~ plant_id,\n
            \ \"state_topic\": plant_topic ~ \"/records_count\",\n  \"command_topic\":
            plant_topic ~ \"/records_count\",\n  \"state_class\": \"measurement\",\n
            \ \"json_attributes_topic\": plant_topic ~ \"/records_attributes\",\n
            \ \"values_template\": \"{{ value | float(0) }}\",\n  \"device\": {\n
            \   \"identifiers\": [device_name],\n    \"name\": variety | default('Plant')
            ~ ' #' ~ plant_number,\n    \"manufacturer\": \"Curated Forest\",\n    \"model\":
            \"Plant Tracking Records\",\n    \"suggested_area\": area_name(plant_area),\n
            \ }\n} | to_json }}\n"
        action: mqtt.publish
      - delay:
          milliseconds: 500
      - if:
        - condition: template
          value_template: '{{ states(''sensor.'' ~ plant_id ~ ''_records'') in [''unknown'',
            ''unavailable'',

            ''none''] }}

            '
        then:
        - data:
            topic: '{{ plant_topic }}/records_attributes'
            retain: true
            payload: "{{ {\n  'record_id': 1,\n  'timestamp': started_at,\n  'quantity':
              1.0,\n  'type': 'Planted',\n  'notes': variety\n} | to_json }}\n"
          action: mqtt.publish
        - data:
            topic: '{{ plant_topic }}/records_count'
            retain: true
            payload: 1
          action: mqtt.publish
      - data:
          topic: '{{ counter_topic }}'
          retain: true
          payload: '{{ plant_number | int + 1 }}'
        action: mqtt.publish
      - delay:
          milliseconds: 200
  - data:
      topic: plants/update_every_hour
      retain: true
      payload: '{{ plants_to_create }}'
    action: mqtt.publish
  - data:
      title: Plant Sensors Created
      message: 'Created {{ plants_to_create }} plant sensor(s). Variety: {{ variety
        | default(''N/A'') }} Starting ID: {{ current_id }} Ending ID: {{ current_id
        | int + plants_to_create | int - 1 }}'
    action: persistent_notification.create
sensors_create_locations:
  sequence:
  - variables:
      ha_topic: homeassistant
      counter_topic: locations/next_location_id
      current_id: "{% if starting_id is defined and starting_id is not none %}\n  {{
        starting_id | int }}\n{% elif states('number.next_location_id') not in ['unknown',
        'unavailable', 'none'] %}\n  {{ states('number.next_location_id') | int }}\n{%
        else %}\n  0\n{% endif %}\n"
      needs_counter_creation: "{{ states('number.next_location_id') in ['unknown',
        'unavailable', 'none'] \n    and (starting_id is not defined or starting_id
        is none) }}\n"
  - if:
    - condition: template
      value_template: '{{ needs_counter_creation }}'
    then:
    - data:
        topic: '{{ ha_topic }}/number/location_tracking/next_location_id/config'
        retain: true
        payload: "{\n  \"name\": \"Next Location ID\",\n  \"unique_id\": \"next_location_id_counter\",\n
          \ \"default_entity_id\": \"sensor.next_location_id\",\n  \"state_topic\":
          \"{{ counter_topic }}\",\n  \"command_topic\": \"{{ counter_topic }}\",\n
          \ \"min\": 0,\n  \"max\": 100000,\n  \"step\": 1,\n  \"mode\": \"box\",\n
          \ \"retain\": true,\n  \"device\": {\n    \"identifiers\": [\"location_tracking\"],\n
          \   \"name\": \"Location Tracking\",\n    \"manufacturer\": \"Curated Forest\"\n
          \ }\n}\n"
      action: mqtt.publish
    - data:
        topic: '{{ counter_topic }}'
        retain: true
        payload: '0'
      action: mqtt.publish
    - delay:
        milliseconds: 500
  - repeat:
      count: '{{ locations_to_create | int }}'
      sequence:
      - variables:
          location_id: '{{ current_id | int + repeat.index - 1 }}'
          location_name: location_{{ location_id }}
          device_name: location_id_{{ location_id }}
          location_topic: locations/{{ location_name }}
      - data:
          topic: '{{ ha_topic }}/switch/{{ device_name }}/active/config'
          retain: true
          payload: "{{ {\n  \"name\": \"Active\",\n  \"unique_id\": device_name ~
            \"_active\",\n  \"default_entity_id\": 'sensor.' ~ device_name,\n  \"state_topic\":
            location_topic ~ \"/active\",\n  \"command_topic\": location_topic ~ \"/active/set\",\n
            \ \"payload_on\": \"true\",\n  \"payload_off\": \"false\",\n  \"state_on\":
            \"true\",\n  \"state_off\": \"false\",\n  \"retain\": true,\n  \"json_attributes_topic\":
            location_topic ~ \"/attributes\",\n  \"device\": {\n    \"identifiers\":
            [device_name],\n    \"name\": 'Location' ~ ' #' ~ location_id,\n    \"manufacturer\":
            \"Curated Forest\",\n    \"suggested_area\": area_name(location_area |
            default(root_zone)),\n    \"model\": \"Location Tracking\"\n  }\n} | to_json
            }}\n"
        action: mqtt.publish
      - data:
          topic: '{{ location_topic }}/active'
          retain: true
          payload: 'true'
        action: mqtt.publish
      - data:
          topic: '{{ location_topic }}/attributes'
          retain: true
          payload: "{{ {\n  'location_id': location_id,\n  'root_zone': root_zone
            | default(''),\n  'shoot_zone': shoot_zone | default(''),\n  'water_supply':
            water_supply | default('')\n} | to_json }}\n"
        action: mqtt.publish
      - data:
          topic: '{{ counter_topic }}'
          retain: true
          payload: '{{ location_id | int + 1 }}'
        action: mqtt.publish
      - delay:
          milliseconds: 200
  - data:
      title: Location Sensors Created
      message: 'Created {{ locations_to_create }} location sensor(s). Starting ID:
        {{ current_id }} Ending ID: {{ current_id | int + locations_to_create | int
        - 1 }}'
    action: persistent_notification.create
  alias: 'Sensors: Create Locations'
  description: Dynamically create location monitoring sensors via MQTT discovery
  mode: queued
  max: 10
  fields:
    locations_to_create:
      name: Number of Locations
      description: How many location sensors to create
      default: 1
      selector:
        number:
          min: 1
          max: 100
      required: true
    root_zone:
      name: Root Zone
      description: Root zone identifier
      default:
      selector:
        area:
          entity:
            device_class: pressure
      required: true
    shoot_zone:
      name: Shoot Zone
      description: Shoot zone identifier
      default:
      selector:
        area:
          entity:
            device_class: pressure
      required: true
    water_supply:
      name: Water Supply
      description: Water supply identifier
      default: water_supply_01
      selector:
        area:
          entity:
            device_class: pressure
      required: true
    location_area:
      name: Location Area
      description: Area to put the location in if not the root_zone
      selector:
        area:
    starting_id:
      name: Starting ID Override
      description: Optional override for the starting location ID number
      selector:
        number:
          min: 0
          max: 10000
sensors_area_manifests:
  alias: 'Sensors: Area Manifests'
  description: Updates a single area manifest sensor via MQTT discovery
  mode: queued
  max: 10
  fields:
    area_id:
      name: Area ID
      description: The area ID to update
      required: true
      selector:
        text:
    area_name:
      name: Area Name
      description: The area name
      required: true
      selector:
        text:
    entity_ids:
      name: Entity IDs
      description: List of entity IDs in the area
      required: false
    device_ids:
      name: Device IDs
      description: List of device IDs in the area
      required: false
  sequence:
  - variables:
      ha_topic: homeassistant
      safe_area_id: '{{ area_id | replace('' '', ''_'') | replace(''-'', ''_'') |
        lower }}'
      sensor_entity_id: sensor.area_manifest_{{ safe_area_id }}
      sensor_topic: area_manifests/{{ safe_area_id }}
      entity_count: '{{ entity_ids | length }}'
      device_count: '{{ device_ids | length }}'
      area_type: '{% set type_labels = labels(area_id) | select(''match'', ''^type_'')
        | list %} {{ type_labels[0].replace(''type_'', '''') if type_labels | length
        > 0 else '''' }}

        '
      label_map: "{% set ns = namespace(data={}) %} {% for lbl_id in labels() %}\n
        \ {% set matching_entities = label_entities(lbl_id) | select('in', entity_ids)
        | list %}\n  {% if matching_entities | length > 0 %}\n    {% set ns.data =
        dict(ns.data, **{lbl_id: matching_entities}) %}\n  {% endif %}\n{% endfor
        %} {{ ns.data }}\n"
  - data:
      topic: '{{ ha_topic }}/sensor/area_manifest_{{ safe_area_id }}/config'
      retain: true
      payload: "{{ {\n  \"name\": area_name ~ \" Area Manifest\",\n  \"object_id\":
        \"area_manifest_\" ~ safe_area_id,\n  \"unique_id\": \"area_manifest_\" ~
        safe_area_id,\n  \"state_topic\": sensor_topic ~ \"/state\",\n  \"json_attributes_topic\":
        sensor_topic ~ \"/attributes\",\n  \"icon\": \"mdi:format-list-bulleted-square\",\n
        \ \"device\": {\n    \"identifiers\": [\"area_manifest_\" ~ safe_area_id],\n
        \   \"name\": area_name ~ \" Area\",\n    \"manufacturer\": \"Home Assistant\",\n
        \   \"model\": \"Area Manifest\"\n  }\n} | to_json }}\n"
    action: mqtt.publish
  - data:
      topic: '{{ sensor_topic }}/state'
      retain: true
      payload: '{{ entity_count }}'
    action: mqtt.publish
  - data:
      topic: '{{ sensor_topic }}/attributes'
      retain: true
      payload: "{% set ns = namespace(label_data={}) %}\n{% for lbl_id in labels()
        %}\n  {% set matching_entities = label_entities(lbl_id) | select('in', entity_ids)
        | list %}\n  {% if matching_entities | length > 0 %}\n    {% set ns.label_data
        = dict(ns.label_data, **{lbl_id: matching_entities}) %}\n  {% endif %}\n{%
        endfor %}\n{{ {\n  'area_id': area_id,\n  'area_name': area_name,\n  'area_type':
        area_type,\n  'entity_ids': entity_ids,\n  'device_ids': device_ids,\n  'entity_count':
        entity_count,\n  'device_count': device_count,\n  'labels': ns.label_data\n}
        | to_json }}\n"
    action: mqtt.publish
label_restore_group:
  alias: 'Label: Restore Group'
  description: >-
    Fires the label_printer_restore event carrying a saved group's template,
    field values, and batch settings. The label-printer-card subscribes to the
    event and repopulates the form.
  mode: parallel
  icon: mdi:restore
  fields:
    entity_id:
      name: Group entity
      description: 'label_group.* entity, e.g. label_group.pantry_staples'
      required: true
      selector:
        text: {}
  sequence:
    # The label_group.* entity's attributes carry the full saved record.
    - if: "{{ state_attr(entity_id, 'slug') is not none }}"
      then:
        - event: label_printer_restore
          event_data:
            template: "{{ state_attr(entity_id, 'template') | default('') }}"
            fields_json: "{{ state_attr(entity_id, 'fields') | default({}) | to_json }}"
            batch_json: "{{ state_attr(entity_id, 'batch') | default({}) | to_json }}"
            search: "{{ state_attr(entity_id, 'search') | default('') }}"

print_label:
  alias: 'Label: Print'
  description: >-
    Generic label printer for the Brother P-Touch service. Pick a template,
    fill in the common fields (name/date/icon), and optionally merge in
    arbitrary extra fields. Set send=true to actually print, false to dry-run
    render. Template list captured from GET /templates on 2026-07-26 — update
    the select options if the API adds templates.
  mode: single
  icon: mdi:label-printer
  fields:
    label_template:
      name: Template
      description: Label template (category/name)
      required: true
      selector:
        select:
          options:
            - kitchen/pantry_jar
            - kitchen/spice
            - kitchen/leftover
            - kitchen/freezer
            - electronics/component_bin
            - electronics/cable_flag
            - electronics/psu_polarity
            - three_d_printing/filament_spool
            - three_d_printing/print_bin
            - three_d_printing/tool_tag
            - utility/qr
            - utility/image
            - garden/seed_packet
            - garden/plant_tag
            - garden/row_marker
            - networking/patch_port
            - networking/rack_unit
            - networking/wap_location
            - workshop/hazard
            - workshop/tool_id
            - workshop/torque_cal
            - workshop/first_aid
            - home_inventory/moving_box
            - home_inventory/warranty
            - home_inventory/storage_bin
            - media/bookshelf_tag
            - media/archive_box
            - media/cd_record
            - pet/collar_backup
            - pet/med_schedule
            - pet/food_bowl
            - travel/luggage_tag
            - travel/gear_bag
            - travel/power_bank
            - calibration/instrument_cal
            - calibration/cert_id
            - calibration/thermometer_cal
    tape_mm:
      name: Tape width (mm)
      description: Loaded tape width
      required: true
      default: '24'
      selector:
        select:
          options:
            - '3.5'
            - '12'
            - '18'
            - '24'
    send:
      name: Send to printer
      description: >-
        true = actually print (POST /print with send:true). false = dry-run
        render (POST /render, returns PNG).
      required: true
      default: false
      selector:
        boolean: {}
    name:
      name: Name / primary text
      description: >-
        Generic primary text. Mapped per-template (e.g. -> variety for
        garden/seed_packet, -> contents for kitchen/leftover). Ignored for
        templates with no obvious primary field; use extra_fields there.
      required: false
      selector:
        text: {}
    date:
      name: Date
      description: >-
        Generic date string. Mapped per-template (e.g. -> purchased for
        kitchen/pantry_jar, -> sow_by for garden/seed_packet). Free text
        because some templates want YYYY-MM or YYYY.
      required: false
      selector:
        text: {}
    date_preset:
      name: Date preset
      description: >-
        Used only when the Date field above is checked but empty. Computes a
        relative date (today, +1 week, etc.). Ignored if Date has a value.
      required: false
      default: '(none)'
      selector:
        select:
          options:
            - '(none)'
            - today
            - 1 week from today
            - 2 weeks from today
            - 1 month from today
            - 3 months from today
    icon:
      name: Icon
      description: Lucide icon name. Passed as 'icon'.
      required: false
      selector:
        select:
          options:
            - antenna
            - apple
            - arrow-right
            - arrow-up-right
            - banana
            - barcode
            - battery
            - beef
            - biohazard
            - bluetooth
            - book
            - bookmark
            - box
            - briefcase
            - cable
            - calendar
            - carrot
            - cat
            - check
            - chef-hat
            - cherry
            - circle
            - clipboard-check
            - clock
            - coffee
            - cog
            - compass
            - cookie
            - cpu
            - croissant
            - dog
            - drill
            - droplets
            - egg
            - file-text
            - fish
            - flame
            - flower-2
            - gauge
            - globe
            - grape
            - hammer
            - hard-drive
            - heart
            - info
            - key
            - leaf
            - lock
            - luggage
            - map
            - map-pin
            - milk
            - monitor
            - network
            - package
            - paintbrush
            - paw-print
            - pill
            - plane
            - plug
            - printer
            - qr-code
            - router
            - ruler
            - salad
            - scale
            - scissors
            - server
            - server-cog
            - shield
            - signal
            - snowflake
            - sprout
            - square
            - star
            - sun
            - syringe
            - tag
            - tent
            - thermometer
            - tree-pine
            - triangle
            - usb
            - utensils
            - wheat
            - wifi
            - wrench
            - x
            - zap
    preview_path:
      name: Preview filename
      description: >-
        Filename for the saved preview PNG (dry-run only). Saved under
        /config/www/labels/. Just the filename, not a path.
      required: false
      default: preview.png
      selector:
        text: {}
    extra_fields:
      name: Extra fields
      description: >-
        Arbitrary dict merged into the API 'fields' object. Wins on key
        collision with name/date/icon mappings.
      required: false
      default: {}
      selector:
        object: {}
    copies:
      name: Copies
      description: >-
        Number of copies to chain-print as one batch (proposal 0002). 1 = a
        normal single label via /print; values > 1 route to the /batch
        endpoints and the preview becomes a stacked strip.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 50
          mode: box
    gap_dots:
      name: Gap between labels (dots)
      description: Extra blank feed between chained labels. Batch only.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 200
          mode: box
    cut_every:
      name: Full cut every N labels
      description: '0 = off (half-cut between labels, full cut at end). Batch only.'
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 50
          mode: box
    half_cut:
      name: Half-cut between labels
      required: false
      default: true
      selector:
        boolean: {}
  sequence:
    # Physical tape wins: preview and print target what's actually loaded.
    # Falls back to the passed tape_mm when the status query fails.
    - action: rest_command.label_printer_status
      response_variable: printer_status
      continue_on_error: true
    - variables:
        tape_mm: >-
          {%- if printer_status is defined and printer_status.content is mapping and printer_status.content.get('ok') -%}
          {{ printer_status.content.tape_mm }}
          {%- else -%}
          {{ tape_mm | default('24') }}
          {%- endif %}
    - variables:
        name_map:
          kitchen/pantry_jar: name
          kitchen/spice: name
          kitchen/leftover: contents
          kitchen/freezer: contents
          electronics/component_bin: value
          electronics/cable_flag: title
          electronics/psu_polarity: null
          three_d_printing/filament_spool: material
          three_d_printing/print_bin: part
          three_d_printing/tool_tag: tool
          utility/qr: data
          utility/image: path
          garden/seed_packet: variety
          garden/plant_tag: name
          garden/row_marker: crop
          networking/patch_port: port
          networking/rack_unit: device
          networking/wap_location: name
          workshop/hazard: text
          workshop/tool_id: name
          workshop/torque_cal: tool
          workshop/first_aid: kit
          home_inventory/moving_box: contents
          home_inventory/warranty: item
          home_inventory/storage_bin: contents
          media/bookshelf_tag: title
          media/archive_box: label
          media/cd_record: title
          pet/collar_backup: name
          pet/med_schedule: pet
          pet/food_bowl: pet
          travel/luggage_tag: name
          travel/gear_bag: bag
          travel/power_bank: capacity_mah
          calibration/instrument_cal: instrument
          calibration/cert_id: cert_no
          calibration/thermometer_cal: instrument
        date_map:
          kitchen/pantry_jar: purchased
          kitchen/spice: best_by
          kitchen/leftover: cooked
          kitchen/freezer: frozen
          electronics/component_bin: null
          electronics/cable_flag: date
          electronics/psu_polarity: null
          three_d_printing/filament_spool: opened
          three_d_printing/print_bin: null
          three_d_printing/tool_tag: null
          utility/qr: null
          utility/image: null
          garden/seed_packet: sow_by
          garden/plant_tag: planted
          garden/row_marker: null
          networking/patch_port: null
          networking/rack_unit: null
          networking/wap_location: null
          workshop/hazard: null
          workshop/tool_id: null
          workshop/torque_cal: last_cal
          workshop/first_aid: expires
          home_inventory/moving_box: null
          home_inventory/warranty: expires
          home_inventory/storage_bin: null
          media/bookshelf_tag: null
          media/archive_box: retain_until
          media/cd_record: year
          pet/collar_backup: null
          pet/med_schedule: null
          pet/food_bowl: null
          travel/luggage_tag: null
          travel/gear_bag: null
          travel/power_bank: charged
          calibration/instrument_cal: next_due
          calibration/cert_id: null
          calibration/thermometer_cal: checked
        # `or ""` guards against null mappings: '{{ None }}' renders as the
        # truthy string "None", which would otherwise inject a bogus "None"
        # field into the API payload for null-mapped templates.
        name_key: '{{ name_map.get(label_template) or "" }}'
        date_key: '{{ date_map.get(label_template) or "" }}'
        resolved_date: >-
          {% if date is defined and date %}
            {{ date }}
          {% elif date_preset is defined and date_preset and date_preset != '(none)' %}
            {% if date_preset == 'today' %}
              {{ now().strftime('%Y-%m-%d') }}
            {% elif date_preset == '1 week from today' %}
              {{ (now() + timedelta(weeks=1)).strftime('%Y-%m-%d') }}
            {% elif date_preset == '2 weeks from today' %}
              {{ (now() + timedelta(weeks=2)).strftime('%Y-%m-%d') }}
            {% elif date_preset == '1 month from today' %}
              {{ (now() + timedelta(days=30)).strftime('%Y-%m-%d') }}
            {% elif date_preset == '3 months from today' %}
              {{ (now() + timedelta(days=90)).strftime('%Y-%m-%d') }}
            {% endif %}
          {% endif %}
        fields: >-
          {% set ef = extra_fields | default({}, true) %}
          {% if ef is string %}
            {% set ef = ef | from_json %}
          {% endif %}
          {% set f = ef | dictsort %}
          {% set f = dict(f) %}
          {% if name is defined and name and name_key and name_key not in f %}
            {% set f = dict(f, **{name_key: name}) %}
          {% endif %}
          {% if resolved_date is defined and resolved_date and resolved_date | trim and date_key and date_key not in f %}
            {% set f = dict(f, **{date_key: resolved_date | trim}) %}
          {% endif %}
          {% if icon is defined and icon and 'icon' not in f %}
            {% set f = dict(f, **{'icon': icon}) %}
          {% endif %}
          {{ f }}
    - if: '{{ send }}'
      then:
        # Batches (copies > 1) go to /batch; single labels keep the /print path.
        - if: '{{ copies | default(1) | int > 1 }}'
          then:
            - action: rest_command.label_print_batch
              data:
                label_template: '{{ label_template }}'
                tape_mm: '{{ tape_mm | default("24") | int }}'
                fields: '{{ fields | to_json }}'
                copies: '{{ copies | default(1) | int }}'
                gap_dots: '{{ gap_dots | default(0) | int }}'
                cut_every: '{{ cut_every | default(0) | int }}'
                half_cut: '{{ half_cut | default(true) | bool }}'
              response_variable: print_response
          else:
            - action: rest_command.print_label
              data:
                label_template: '{{ label_template }}'
                tape_mm: '{{ tape_mm | default("24") | int }}'
                fields: '{{ fields | to_json }}'
              response_variable: print_response
        # rest_command only raises on timeout/connection/decode errors — an
        # HTTP error status (e.g. 409 printer busy) just logs a warning and
        # returns normally. Record the outcome for the dashboard and stop
        # hard on failure so callers see the error too.
        - if: '{{ print_response.status >= 400 }}'
          then:
            - action: input_text.set_value
              target:
                entity_id: input_text.label_last_result
              data:
                value: >-
                  {% set c = print_response.content -%}
                  {% if c is string -%}
                  {% set reason = c -%}
                  {% elif c is mapping -%}
                  {% set reason = c.get('detail') or c.get('error') or c.get('message') or (c | to_json) -%}
                  {% else -%}
                  {% set reason = '' -%}
                  {% endif -%}
                  Print failed: HTTP {{ print_response.status }}{{ ' — ' ~ reason[:150] if reason else '' }} ({{ now().strftime('%H:%M:%S') }})
            - stop: 'Label print failed (HTTP {{ print_response.status }})'
              error: true
        - action: input_text.set_value
          target:
            entity_id: input_text.label_last_result
          data:
            value: 'Printed OK{{ " — " ~ print_response.content.labels ~ " labels" if print_response.content is mapping and print_response.content.labels else "" }} ({{ now().strftime(''%H:%M:%S'') }})'
      else:
        # Batches preview as a stacked strip via /render/batch.
        - if: '{{ copies | default(1) | int > 1 }}'
          then:
            - action: rest_command.label_render_batch
              data:
                label_template: '{{ label_template }}'
                tape_mm: '{{ tape_mm | default("24") | int }}'
                fields: '{{ fields | to_json }}'
                copies: '{{ copies | default(1) | int }}'
                gap_dots: '{{ gap_dots | default(0) | int }}'
                cut_every: '{{ cut_every | default(0) | int }}'
                half_cut: '{{ half_cut | default(true) | bool }}'
              response_variable: render_response
          else:
            - action: rest_command.render_label
              data:
                label_template: '{{ label_template }}'
                tape_mm: '{{ tape_mm | default("24") | int }}'
                fields: '{{ fields | to_json }}'
              response_variable: render_response
        # rest_command only raises on timeout/connection/decode errors — an
        # HTTP error status just logs a warning and returns the error body.
        # Guard so a failed render never zeroes out the last good preview.png,
        # and record the outcome for the dashboard (script.label_preview_from_helpers
        # then skips its preview-token bump).
        - if: '{{ render_response.status >= 400 or render_response.content.png_b64 is not defined }}'
          then:
            - action: input_text.set_value
              target:
                entity_id: input_text.label_last_result
              data:
                value: >-
                  {% set c = render_response.content -%}
                  {% if c is string -%}
                  {% set reason = c -%}
                  {% elif c is mapping -%}
                  {% set reason = c.get('detail') or c.get('error') or c.get('message') or (c | to_json) -%}
                  {% else -%}
                  {% set reason = '' -%}
                  {% endif -%}
                  Preview failed: HTTP {{ render_response.status }}{{ ' — ' ~ reason[:150] if reason else '' }} ({{ now().strftime('%H:%M:%S') }})
            - stop: 'Label render failed (HTTP {{ render_response.status }})'
              error: true
        - action: shell_command.save_label_preview
          data:
            b64: '{{ render_response.content.png_b64 }}'
            filename: '{{ preview_path | default("preview.png") }}'
        # A good preview clears any stale failure message — the updated image
        # is feedback enough, and this keeps the status line unambiguous.
        - action: input_text.set_value
          target:
            entity_id: input_text.label_last_result
          data:
            value: ''
        # Bump the cache-buster so dashboard cards reload preview.png.
        - action: input_text.set_value
          target:
            entity_id: input_text.label_preview_token
          data:
            value: '{{ now().timestamp() | int }}'
