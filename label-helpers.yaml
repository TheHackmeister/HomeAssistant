# ─────────────────────────────────────────────────────────────────────
# Label Printer dashboard helpers (input_select)
#
# Backing inputs for dashboards/label-printer.yaml. Read by
# script.label_run and reset by script.label_reset.
#
# Imported from configuration.yaml via:
#   input_select: !include label-helpers.yaml
#
# NOTE: `label_template` options mirror script.print_label's Template
# field (captured from GET /templates on 2026-07-26) and
# `label_icon` mirrors its Lucide icon list. Update both if the
# brother-ptouch-automation API adds templates/icons.
# ─────────────────────────────────────────────────────────────────────

label_template:
  name: 'Label: Template'
  icon: mdi:label-variant-outline
  initial: kitchen/pantry_jar
  options:
    - kitchen/pantry_jar
