#######################################################################################################################
## Package - WeKan
## All WeKan (https://wekan.spencerslab.com) board automation in one place for AI context isolation:
##   - rest_command: WeKan REST API calls (auth via !secret wekan_api_token)
##   - automation:   nightly board organization schedule
##   - script:       board organization logic (swimlane moves, recurring tasks, inbox reset)
##
## Board: TrfngHQf8PWj9mnqC
## Nightly flow (automation.boards_daily_task_organization, 00:01):
##   1. boards_update_recurring_tasks       - bump due dates on labeled recurring cards (Today / Inbox-Reset)
##   2. boards_archive_past_unlabeled_tasks - archive past-due unlabeled cards (Today / Inbox-Reset)
##   3. boards_reset_inbox_cards            - delete past-due "Events & Waiting" cards; uncheck all checklist
##                                            items on cards labeled "Reset Checklists"
##   4. boards_move_future_cards_to_default - move future-dated cards Today -> Default swimlane
##   5. boards_organize_by_labels           - move labeled cards to same-name lists (Default swimlane)
##   6-9. boards_next_week_s_tasks x4       - cascade cards Next Week -> This Week -> Tomorrow -> Today
#######################################################################################################################

rest_command:
  get_board_swimlanes:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/swimlanes
    method: GET
    headers:
      Authorization: !secret wekan_api_token

  get_card:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/lists/{{ listId }}/cards/{{ cardId }}
    method: GET
    headers:
      Authorization: !secret wekan_api_token
  
  update_card_due_date:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/lists/{{ listId }}/cards/{{ cardId }}
    method: PUT
    payload: >
      {"dueAt": "{{ dueAt }}"}
    headers:
      Accept: application/json
      Content-Type: application/json
      Authorization: !secret wekan_api_token
  
  get_board:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}
    method: GET
    headers:
      Authorization: !secret wekan_api_token
  archive_card:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/lists/{{ listId }}/cards/{{ cardId }}
    method: PUT  
    payload: '{"archive": "true", "listId": "{{ listId }}"}'
    headers:
      Accept: application/json
      Content-Type: application/json
      Authorization: !secret wekan_api_token

  get_cards_from_swimlane:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/swimlanes/{{ swimlaneId }}/cards
    method: GET
    headers: 
      Authorization: !secret wekan_api_token

  get_board_lists:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/lists
    method: GET
    headers:
      Authorization: !secret wekan_api_token

  move_card_to_swimlane:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/lists/{{ listId }}/cards/{{ cardId }}
    method: PUT
    payload: >
      {"swimlaneId": "{{ swimlaneId }}", "listId": "{{ newListId }}"}
    headers:
      Accept: application/json
      Content-Type: application/json
      Authorization: !secret wekan_api_token

  # Permanently delete a card (no archive, no undo in WeKan).
  delete_card:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/lists/{{ listId }}/cards/{{ cardId }}
    method: DELETE
    headers:
      Authorization: !secret wekan_api_token

  # All checklists on a card. NOTE (verified live 2026-09-07): this list
  # endpoint does NOT embed the checklist items array — fetch each checklist
  # via get_checklist below to get its items.
  get_card_checklists:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/cards/{{ cardId }}/checklists
    method: GET
    headers:
      Authorization: !secret wekan_api_token

  # Single checklist with its items array embedded ({_id, title, isFinished}).
  get_checklist:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/cards/{{ cardId }}/checklists/{{ checklistId }}
    method: GET
    headers:
      Authorization: !secret wekan_api_token

  # Set a checklist item's finished state.
  update_checklist_item:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/cards/{{ cardId }}/checklists/{{ checklistId }}/items/{{ itemId }}
    method: PUT
    payload: >
      {"isFinished": {{ 'true' if isFinished | bool else 'false' }}}
    headers:
      Accept: application/json
      Content-Type: application/json
      Authorization: !secret wekan_api_token

  # Add a label to the board. Labels drive this board's automation
  # (organize-by-label, recurring due dates, events, checklist reset).
  add_board_label:
    url: https://wekan.spencerslab.com/api/boards/{{ boardId }}/labels
    method: PUT
    payload: >
      {"label": {"name": "{{ label_name }}", "color": "{{ label_color | default('sky',
      true) }}"}}
    headers:
      Accept: application/json
      Content-Type: application/json
      Authorization: !secret wekan_api_token

