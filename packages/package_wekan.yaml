  boards_update_recurring_tasks:
    sequence:
    - action: rest_command.get_board_swimlanes
      metadata: {}
      data:
        boardId: '{{ boardId }}'
      response_variable: all_swimlanes
    - variables:
        from_swimlane_match: '{{ all_swimlanes.content | selectattr(''title'', ''eq'',
          from_swimlane_name) | list }}

          '
        from_swimlaneId: '{{ from_swimlane_match[0]._id if from_swimlane_match | length
          > 0 else '''' }}

          '
    - if:
      - condition: template
        value_template: '{{ from_swimlaneId == "" }}'
      then:
      - action: system_log.write
        metadata: {}
        data:
          level: error
          message: 'Could not find swimlane: {{ from_swimlane_name }}'
      - stop: ''
        enabled: false
    - action: rest_command.get_board_lists
      metadata: {}
      data:
        boardId: '{{ boardId }}'
      response_variable: all_lists
    - action: rest_command.get_board
      metadata: {}
      data:
        boardId: '{{ boardId }}'
      response_variable: board_data
    - variables:
        all_labels: '{{ board_data.content.labels if board_data.content.labels is defined
          else [] }}'
    - action: rest_command.get_cards_from_swimlane
      metadata: {}
      data:
        swimlaneId: '{{ from_swimlaneId }}'
        boardId: '{{ boardId }}'
      response_variable: from_cards
    - if:
      - condition: template
        value_template: '{{ from_cards.content | count == 0 }}'
      then:
      - action: persistent_notification.create
        metadata: {}
        data:
          message: No cards found in {{ from_swimlane_name }} swimlane
      - stop: ''
        enabled: false
    - repeat:
        sequence:
        - variables:
            card_list_match: '{{ all_lists.content | selectattr(''_id'', ''eq'', repeat.item.listId)
              | list }}

              '
            card_list_title: '{{ card_list_match[0].title if card_list_match | length
              > 0 else '''' }}

              '
        - if:
          - condition: template
            value_template: '{{ card_list_title == from_list_name }}'
          then:
          - action: rest_command.get_card
            metadata: {}
            data:
              boardId: '{{ boardId }}'
              listId: '{{ repeat.item.listId }}'
              cardId: '{{ repeat.item._id }}'
            response_variable: full_card_details
          - variables:
              card_label_ids: '{{ full_card_details.content.get(''labelIds'', []) if
                full_card_details.content.get(''labelIds'') is not none else [] }}'
          - if:
            - condition: template
              value_template: '{{ card_label_ids | length > 0 }}'
            then:
            - variables:
                card_label_names: "{% set names = namespace(items=[]) %} {% for label_id
                  in card_label_ids %}\n  {% set matching = all_labels | selectattr('_id',
                  'eq', label_id) | list %}\n  {% if matching | length > 0 %}\n    {%
                  set names.items = names.items + [matching[0].name | lower] %}\n  {%
                  endif %}\n{% endfor %} {{ names.items }}"
                has_weekly: '{{ ''weekly'' in card_label_names }}'
                has_bi_weekly: '{{ ''bi-weekly'' in card_label_names }}'
                has_monthly: '{{ ''monthly'' in card_label_names }}'
                has_bi_monthly: '{{ ''bi-monthly'' in card_label_names }}'
                has_quarterly: '{{ ''quarterly'' in card_label_names }}'
                has_bi_quarterly: '{{ ''bi-quarterly'' in card_label_names }}'
                has_yearly: '{{ ''yearly'' in card_label_names }}'
                has_bi_yearly: '{{ ''bi-yearly'' in card_label_names }}'
                has_annually: '{{ ''annually'' in card_label_names }}'
            - variables:
                new_due_date: "{% if has_weekly %}\n  {{ (now() + timedelta(weeks=1)).isoformat()
                  }}\n{% elif has_bi_weekly %}\n  {{ (now() + timedelta(weeks=2)).isoformat()
                  }}\n{% elif has_monthly %}\n  {{ (now() + timedelta(days=30)).isoformat()
                  }}\n{% elif has_quarterly %}\n  {{ (now() + timedelta(days=90)).isoformat()
                  }}\n{% elif has_yearly %}\n  {{ (now() + timedelta(days=365)).isoformat()
                  }}\n{% elif has_bi_monthly %}\n  {{ (now() + timedelta(days=60)).isoformat()
                  }}\n{% elif has_bi_quarterly %}\n  {{ (now() + timedelta(days=180)).isoformat()
                  }}\n{% elif has_bi_yearly %}\n  {{ (now() + timedelta(days=730)).isoformat()
                  }}\n{% elif has_annually %}\n  {% if full_card_details.content.dueAt
                  is defined and full_card_details.content.dueAt != None %}\n    {{
                  (as_datetime(full_card_details.content.dueAt) + timedelta(days=365)).isoformat()
                  }}\n  {% else %}\n    {{ (now() + timedelta(days=365)).isoformat()
                  }}\n  {% endif %}\n{% else %}\n  \n{% endif %}\n"
                recurrence_type: "{% if has_weekly %}\n  weekly\n{% elif has_monthly
                  %}\n  monthly\n{% elif has_quarterly %}\n  quarterly\n{% elif has_yearly
                  %}\n  yearly\n{% elif has_bi_weekly %}\n  bi-weekly\n{% elif has_bi_monthly
                  %}\n  bi-monthly\n{% elif has_bi_quarterly %}\n  bi-quarterly\n{%
                  elif has_bi_yearly %}\n  bi-yearly\n{% elif has_annually %}\n  annually\n{%
                  else %}\n  none\n{% endif %}\n"
            - if:
              - condition: template
                value_template: '{{ recurrence_type != "none" }}'
              then:
              - variables:
                  current_due_date: '{{ full_card_details.content.dueAt if full_card_details.content.dueAt
                    is defined else none }}'
                  is_past_due: '{{ current_due_date is none or (current_due_date | as_datetime)
                    < now() }}'
              - if:
                - condition: template
                  value_template: '{{ is_past_due }}'
                then:
                - action: system_log.write
                  metadata: {}
                  data:
                    level: info
                    message: 'Updating {{ recurrence_type }} recurring task "{{ repeat.item.title
                      }}" with new due date: {{ new_due_date }}'
                - action: rest_command.update_card_due_date
                  metadata: {}
                  data:
                    cardId: '{{ full_card_details.content._id }}'
                    listId: '{{ full_card_details.content.listId }}'
                    boardId: '{{ boardId }}'
                    dueAt: '{{ new_due_date }}'
                  response_variable: update_result
                else:
                - action: system_log.write
                  metadata: {}
                  data:
                    level: debug
                    message: Skipping "{{ repeat.item.title }}" - due date {{ current_due_date
                      }} is in the future
        for_each: '{{ from_cards.content }}'
    alias: 'Boards: Update Recurring Tasks'
    description: Updates due dates for recurring tasks based on their labels (FIXED
      - fetches full card details)
    fields:
      boardId:
        selector:
          text:
        name: boardId
        description: Board ID
        default: TrfngHQf8PWj9mnqC
        required: false
      from_swimlane_name:
        selector:
          text:
        name: From Swimlane Name
        description: Swimlane to check for recurring tasks
        default: Today
        required: true
      from_list_name:
        selector:
          text:
        name: From List Name
        description: List to check for recurring tasks
        default: Inbox/Reset
        required: true

  boards_reset_inbox_cards:
    sequence:
    - action: rest_command.get_board_swimlanes
      metadata: {}
      data:
        boardId: '{{ boardId }}'
      response_variable: all_swimlanes
    # Fail fast with a clear diagnostic when the WeKan API returns an error
    # object instead of a list (expired/invalid wekan_api_token, WITH_API
    # off, server down). Without this, the error body silently renders as
    # "swimlane not found" or aborts a downstream repeat with a TypeError.
    - if:
      - condition: template
        value_template: '{% set c = (all_swimlanes | default({})).content %}{{ not
          (c is defined and c is iterable and c is not string and c is not mapping)
          }}'
      then:
      - action: system_log.write
        metadata: {}
        data:
          level: error
          message: 'WeKan API error fetching swimlanes for board {{ boardId }} (expired/invalid
            wekan_api_token, or WITH_API off on the server?): {{ (all_swimlanes |
            default({})).content }}'
      - stop: 'WeKan API error'
    - variables:
        swimlane_match: '{{ all_swimlanes.content | selectattr(''title'', ''eq'',
          swimlane_name) | list }}

          '
        swimlaneId: '{{ swimlane_match[0]._id if swimlane_match | length > 0 else ''''
          }}

          '
    - if:
      - condition: template
        value_template: '{{ swimlaneId == "" }}'
      then:
      - action: system_log.write
        metadata: {}
        data:
          level: error
          message: 'Could not find swimlane: {{ swimlane_name }}'
      - stop: 'Swimlane not found'
    - action: rest_command.get_board_lists
      metadata: {}
      data:
        boardId: '{{ boardId }}'
      response_variable: all_lists
    - action: rest_command.get_board
      metadata: {}
      data:
        boardId: '{{ boardId }}'
      response_variable: board_data
    - variables:
        all_labels: '{{ board_data.content.labels if board_data.content.labels is defined
          else [] }}'
    - action: rest_command.get_cards_from_swimlane
      metadata: {}
      data:
        swimlaneId: '{{ swimlaneId }}'
        boardId: '{{ boardId }}'
      response_variable: swimlane_cards
    - if:
      - condition: template
        value_template: '{{ swimlane_cards.content | count == 0 }}'
      then:
      - action: persistent_notification.create
        metadata: {}
        data:
          message: No cards found in {{ swimlane_name }} swimlane
      - stop: 'No cards in swimlane'
    - repeat:
        sequence:
        - variables:
            card_list_match: '{{ all_lists.content | selectattr(''_id'', ''eq'', repeat.item.listId)
              | list }}

              '
            card_list_title: '{{ card_list_match[0].title if card_list_match | length
              > 0 else '''' }}

              '
        - if:
          - condition: template
            value_template: '{{ card_list_title == list_name }}'
          then:
          - action: rest_command.get_card
            metadata: {}
            data:
              boardId: '{{ boardId }}'
              listId: '{{ repeat.item.listId }}'
              cardId: '{{ repeat.item._id }}'
            response_variable: full_card_details
          - variables:
              card_label_ids: '{{ full_card_details.content.get(''labelIds'', []) if
                full_card_details.content.get(''labelIds'') is not none else [] }}'
              card_label_names: "{% set names = namespace(items=[]) %} {% for label_id
                in card_label_ids %}\n  {% set matching = all_labels | selectattr('_id',
                'eq', label_id) | list %}\n  {% if matching | length > 0 %}\n    {%
                set names.items = names.items + [matching[0].name | lower] %}\n  {%
                endif %}\n{% endfor %} {{ names.items }}"
              is_event: '{{ event_label_name | lower in card_label_names }}'
              has_reset_label: '{{ reset_label_name | lower in card_label_names }}'
              is_past_due: '{{ full_card_details.content.dueAt is defined and full_card_details.content.dueAt
                != None and as_datetime(full_card_details.content.dueAt) < now() }}'
          - if:
            - condition: template
              value_template: '{{ is_event and is_past_due }}'
            then:
            - action: system_log.write
              metadata: {}
              data:
                level: info
                message: 'Deleting past-due event card "{{ repeat.item.title }}" (due
                  {{ full_card_details.content.dueAt }})'
            - action: rest_command.delete_card
              metadata: {}
              data:
                boardId: '{{ boardId }}'
                listId: '{{ full_card_details.content.listId }}'
                cardId: '{{ repeat.item._id }}'
              response_variable: delete_result
            - action: system_log.write
              metadata: {}
              data:
                level: info
                message: 'Delete result for "{{ repeat.item.title }}": {{ delete_result
                  }}'
            else:
            - if:
              - condition: template
                value_template: '{{ not is_event and has_reset_label }}'
              then:
              - action: rest_command.get_card_checklists
                metadata: {}
                data:
                  boardId: '{{ boardId }}'
                  cardId: '{{ repeat.item._id }}'
                response_variable: card_checklists
              - repeat:
                  sequence:
                  - variables:
                      checklist_id: '{{ repeat.item._id }}'
                  # The list-checklists endpoint does NOT embed items, so fetch
                  # this one checklist to read its items array.
                  - action: rest_command.get_checklist
                    metadata: {}
                    data:
                      boardId: '{{ boardId }}'
                      cardId: '{{ full_card_details.content._id }}'
                      checklistId: '{{ checklist_id }}'
                    response_variable: checklist_detail
                  - variables:
                      checked_items: '{{ checklist_detail.content.items | default([],
                        true) | selectattr(''isFinished'', ''eq'', true) | list }}'
                  - repeat:
                      sequence:
                      - action: system_log.write
                        metadata: {}
                        data:
                          level: debug
                          message: 'Unchecking item "{{ repeat.item.title }}" on card
                            "{{ full_card_details.content.title }}"'
                      - action: rest_command.update_checklist_item
                        metadata: {}
                        data:
                          boardId: '{{ boardId }}'
                          cardId: '{{ full_card_details.content._id }}'
                          checklistId: '{{ checklist_id }}'
                          itemId: '{{ repeat.item._id }}'
                          isFinished: false
                      for_each: '{{ checked_items }}'
                  for_each: '{{ card_checklists.content if card_checklists.content
                    is sequence and card_checklists.content is not string else [] }}'
        for_each: '{{ swimlane_cards.content if swimlane_cards.content is sequence
          and swimlane_cards.content is not string else [] }}'
    alias: 'Boards: Reset Inbox Cards'
    description: Nightly cleanup of the Inbox/Reset list (the "Done" list). Past-due
      cards labeled as events are permanently deleted; non-event cards carrying the
      reset label get all checklist items unchecked so recurring work starts fresh.
    fields:
      boardId:
        selector:
          text:
        name: boardId
        description: Board ID
        default: TrfngHQf8PWj9mnqC
        required: false
      swimlane_name:
        selector:
          text:
        name: Swimlane Name
        description: Swimlane containing the list to process
        default: Today
        required: true
      list_name:
        selector:
          text:
        name: List Name
        description: List to process (the "Done" list)
        default: Inbox/Reset
        required: true
      event_label_name:
        selector:
          text:
        name: Event Label Name
        description: Board label that marks a card as an event
        default: Events & Waiting
        required: true
      reset_label_name:
        selector:
          text:
        name: Reset Label Name
        description: Board label that opts a non-event card into checklist reset
        default: Reset Checklists
        required: true
