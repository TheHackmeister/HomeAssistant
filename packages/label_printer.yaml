#######################################################################################################################
## Package - Label Printer
##
## Dashboard-driven flow for the Brother P-Touch label service (rest_command.print_label / render_label):
##   1. User fills the helpers below on the Label Printer dashboard
##   2. "Preview Label"  -> script.label_apply_from_helpers {send: false} -> dry-run render saved to
##      /config/www/labels/preview.png (served at /local/labels/preview.png), then bumps
##      input_text.label_preview_token so the dashboard's markdown card reloads the image
##   3. "Send to Printer" -> script.label_apply_from_helpers {send: true} -> prints the same label
##   4. "Reset" -> script.label_reset_helpers restores every helper to its default
##
## script.print_label (scripts.yaml) stays the single source of truth for template/field mapping;
## the glue script here only bridges the dashboard helpers to it (dashboard actions can't template).
#######################################################################################################################

