#######################################################################################################################
## Package - Label Printer
##
## Dashboard-driven flow for the Brother P-Touch label service (rest_command.print_label / render_label):
##   1. User picks a template; the dashboard form shows that template's fields, relabeled from a
##      shared pool of generic text helpers (input_text.label_field_1..6) via config-template-card
##   2. "Preview Label"  -> script.label_preview_from_helpers -> dry-run render saved to
##      /config/www/labels/preview.png (served at /local/labels/preview.png), then bumps
##      input_text.label_preview_token so the dashboard's markdown card reloads the image
##   3. "Send to Printer" -> script.label_print_from_helpers -> prints the same label
##   4. "Reset" -> script.label_reset_helpers restores every helper to its default
##
## The glue scripts map the field pool onto the template's real field names using the schema map
## below (captured from GET /templates on 2026-08-07), validate required fields BEFORE calling the
## API (the server returns an unhelpful bare 500 for missing fields), and only pass icon to
## templates that declare one. Fields beyond the 7 pool slots (electronics/cable_flag's wire and
## overlap_mm) go through input_text.label_extra_fields as a JSON object.
##
## script.print_label (scripts.yaml) stays the engine (render/print + last-result status writes);
## the glue scripts here bridge the dashboard helpers to it (dashboard actions can't template).
## They intentionally take NO fields: a previous version with a boolean selector field kept
## failing validation on deploy ("Only one type can be specified" on an emptied selector map),
## so there is deliberately nothing here to mangle in transit.
#######################################################################################################################

