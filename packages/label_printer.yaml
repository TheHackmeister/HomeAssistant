input_boolean:
  # When on, the Label: Live Reload automation re-renders the preview on
  # every field change. Off by default.
  label_live_reload:
    name: 'Label: Live reload preview'
    icon: mdi:autorenew
    initial: true

input_text:
  # Generic field pool. The dashboard relabels these per selected template and
  # the glue scripts map them positionally onto the template's real field names
  # (see the schema map in the scripts below). Cleared when the template changes.
  label_field_1:
    name: 'Label: Field 1'
    max: 255
    initial: ''
  label_field_2:
    name: 'Label: Field 2'
    max: 255
    initial: ''
  label_field_3:
    name: 'Label: Field 3'
    max: 255
    initial: ''
  label_field_4:
    name: 'Label: Field 4'
    max: 255
    initial: ''
  label_field_5:
    name: 'Label: Field 5'
    max: 255
    initial: ''
  label_field_6:
    name: 'Label: Field 6'
    max: 255
    initial: ''
  label_field_7:
    name: 'Label: Field 7'
    max: 255
    initial: ''

  label_extra_fields:
    name: 'Label: Extra fields (JSON object)'
    icon: mdi:code-json
    max: 255
    initial: ''

  # Internal plumbing: cache-buster for the dashboard preview image. Updated by
  # script.label_preview_from_helpers after every successful dry-run render; the
  # markdown card re-renders when this changes. Not shown on the dashboard.
  label_preview_token:
    name: 'Label: Preview token'
    icon: mdi:refresh
    max: 100
    initial: ''

  # Last preview/print outcome, written by script.print_label on API failure
  # paths and by the glue scripts on validation failure; shown under the
  # preview. A successful preview clears it (the image is feedback enough).
  label_last_result:
    name: 'Label: Last result'
    icon: mdi:message-text-outline
    max: 255
    initial: ''

automation:
  # Switching templates clears the pool so stale values never leak into a
  # different template's fields, and applies the template's default tape width
  # (a tape mismatch makes the printer reject the job with a 409).
  - id: label_template_changed
    alias: 'Label: Template Changed'
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.label_template
    actions:
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.label_field_1
            - input_text.label_field_2
            - input_text.label_field_3
            - input_text.label_field_4
            - input_text.label_field_5
            - input_text.label_field_6
            - input_text.label_field_7
        data:
          value: ''
      # default_tape_mm per template (GET /templates, 2026-08-07)
      - variables:
          default_tape:
            kitchen/pantry_jar: '12'
            kitchen/spice: '12'
            kitchen/leftover: '12'
            kitchen/freezer: '12'
            electronics/component_bin: '12'
            electronics/cable_flag: '12'
            electronics/psu_polarity: '12'
            three_d_printing/filament_spool: '12'
            three_d_printing/print_bin: '12'
            three_d_printing/tool_tag: '12'
            utility/qr: '12'
            utility/image: '12'
            garden/seed_packet: '12'
            garden/plant_tag: '12'
            garden/row_marker: '12'
            networking/patch_port: '12'
            networking/rack_unit: '12'
            networking/wap_location: '12'
            workshop/hazard: '12'
            workshop/tool_id: '12'
            workshop/torque_cal: '12'
            workshop/first_aid: '12'
            home_inventory/moving_box: '24'
            home_inventory/warranty: '12'
            home_inventory/storage_bin: '12'
            media/bookshelf_tag: '12'
            media/archive_box: '18'
            media/cd_record: '12'
            pet/collar_backup: '12'
            pet/med_schedule: '12'
            pet/food_bowl: '12'
            travel/luggage_tag: '18'
            travel/gear_bag: '12'
            travel/power_bank: '12'
            calibration/instrument_cal: '12'
            calibration/cert_id: '12'
            calibration/thermometer_cal: '12'
      - action: input_select.select_option
        target:
          entity_id: input_select.label_tape_mm
        data:
          option: '{{ default_tape[trigger.to_state.state] | default("24") }}'

  # Live reload: re-render the preview whenever a form field changes, while
  # input_boolean.label_live_reload is on. The preview substitutes placeholders
  # for empty required fields, so every change renders something meaningful.
  # Loop-safe by construction: the preview script never writes any of these
  # trigger entities (it writes label_preview_token / label_last_result and
  # syncs label_tape_mm, none of which are triggers here).
  - id: label_live_reload
    alias: 'Label: Live Reload'
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.label_template
      - trigger: state
        entity_id: input_select.label_icon
      - trigger: state
        entity_id: input_text.label_field_1
      - trigger: state
        entity_id: input_text.label_field_2
      - trigger: state
        entity_id: input_text.label_field_3
      - trigger: state
        entity_id: input_text.label_field_4
      - trigger: state
        entity_id: input_text.label_field_5
      - trigger: state
        entity_id: input_text.label_field_6
      - trigger: state
        entity_id: input_text.label_field_7
      - trigger: state
        entity_id: input_text.label_extra_fields
    conditions:
      - condition: state
        entity_id: input_boolean.label_live_reload
        state: 'on'
    actions:
      - action: script.label_preview_from_helpers

script:
  label_preview_from_helpers:
    alias: 'Label: Preview From Helpers'
    description: >-
      Reads the Label Printer dashboard helpers, validates the template's
      required fields, and dry-run renders the label to
      /local/labels/preview.png, then bumps the preview token so the dashboard
      image refreshes.
    mode: single
    icon: mdi:image-search
    sequence:
      - variables:
          # Template schema: real field names in API order (icon stripped — it
          # comes from input_select.label_icon), per-template icon support.
          # Captured from GET /templates on 2026-08-07. The same schema is
          # embedded in the dashboard card — update both together.
          schema: &label_schema
            kitchen/pantry_jar: { icon: true,  fields: [ ['name', true], ['purchased', true], ['expires', false] ] }
            kitchen/spice: { icon: false, fields: [ ['name', true], ['origin', false], ['best_by', false] ] }
            kitchen/leftover: { icon: false, fields: [ ['contents', true], ['cooked', true], ['eat_within_days', false] ] }
            kitchen/freezer: { icon: false, fields: [ ['contents', true], ['frozen', true], ['portion', false] ] }
            electronics/component_bin: { icon: false, fields: [ ['value', true], ['footprint', true], ['tolerance', false] ] }
            electronics/cable_flag: { icon: false, fields: [ ['title', false], ['source', false], ['dest', false], ['date', false], ['details', false], ['link', false], ['image', false] ] }
            electronics/psu_polarity: { icon: false, fields: [ ['voltage', true], ['current', true], ['polarity', false] ] }
            three_d_printing/filament_spool: { icon: false, fields: [ ['material', true], ['color', true], ['brand', true], ['opened', true], ['nozzle_temp', false], ['bed_temp', false] ] }
            three_d_printing/print_bin: { icon: false, fields: [ ['part', true], ['project', false], ['qty', false] ] }
            three_d_printing/tool_tag: { icon: false, fields: [ ['tool', true], ['owner', false] ] }
            utility/qr: { icon: false, fields: [ ['data', true], ['caption', false] ] }
            utility/image: { icon: false, fields: [ ['path', true], ['caption', false], ['threshold', false] ] }
            garden/seed_packet: { icon: true,  fields: [ ['variety', true], ['sow_by', true], ['year', false] ] }
            garden/plant_tag: { icon: true,  fields: [ ['name', true], ['planted', true] ] }
            garden/row_marker: { icon: true,  fields: [ ['crop', true], ['variety', true] ] }
            networking/patch_port: { icon: true,  fields: [ ['port', true], ['vlan', true], ['dest', false] ] }
            networking/rack_unit: { icon: true,  fields: [ ['unit', true], ['device', true] ] }
            networking/wap_location: { icon: true,  fields: [ ['name', true], ['location', true] ] }
            workshop/hazard: { icon: true,  fields: [ ['hazard', true], ['text', true], ['code', false] ] }
            workshop/tool_id: { icon: true,  fields: [ ['name', true], ['owner', true], ['project', false] ] }
            workshop/torque_cal: { icon: true,  fields: [ ['tool', true], ['range_nm', true], ['last_cal', true] ] }
            workshop/first_aid: { icon: true,  fields: [ ['kit', true], ['expires', true] ] }
            home_inventory/moving_box: { icon: true,  fields: [ ['room', true], ['contents', true], ['fragile', false] ] }
            home_inventory/warranty: { icon: true,  fields: [ ['item', true], ['expires', true], ['receipt', false] ] }
            home_inventory/storage_bin: { icon: true,  fields: [ ['location', true], ['contents', true] ] }
            media/bookshelf_tag: { icon: true,  fields: [ ['title', true], ['author', true], ['callno', false] ] }
            media/archive_box: { icon: true,  fields: [ ['label', true], ['retain_until', true] ] }
            media/cd_record: { icon: true,  fields: [ ['title', true], ['artist', true], ['year', false] ] }
            pet/collar_backup: { icon: true,  fields: [ ['name', true], ['contact', true] ] }
            pet/med_schedule: { icon: true,  fields: [ ['pet', true], ['med', true], ['cadence', true] ] }
            pet/food_bowl: { icon: true,  fields: [ ['pet', true], ['food', true], ['portion', true] ] }
            travel/luggage_tag: { icon: true,  fields: [ ['name', true], ['contact', true] ] }
            travel/gear_bag: { icon: true,  fields: [ ['bag', true], ['purpose', true] ] }
            travel/power_bank: { icon: true,  fields: [ ['capacity_mah', true], ['charged', true], ['model', false] ] }
            calibration/instrument_cal: { icon: true,  fields: [ ['instrument', true], ['next_due', true], ['owner', false] ] }
            calibration/cert_id: { icon: true,  fields: [ ['cert_no', true], ['issuer', true] ] }
            calibration/thermometer_cal: { icon: true,  fields: [ ['instrument', true], ['ice_point_c', true], ['checked', true] ] }
          tpl: "{{ states('input_select.label_template') }}"
          pool:
            - "{{ states('input_text.label_field_1') }}"
            - "{{ states('input_text.label_field_2') }}"
            - "{{ states('input_text.label_field_3') }}"
            - "{{ states('input_text.label_field_4') }}"
            - "{{ states('input_text.label_field_5') }}"
            - "{{ states('input_text.label_field_6') }}"
            - "{{ states('input_text.label_field_7') }}"
          icon_sel: "{{ states('input_select.label_icon') }}"
          extra_raw: "{{ states('input_text.label_extra_fields') }}"
          # HA parses variable render results into native types, so `built`
          # arrives at the action below as a dict, not a string.
          # Empty REQUIRED pool slots are filled with their own field name so
          # a preview shows exactly where each field lands on the label; the
          # print script keeps the strict missing-field validation instead.
          built: >-
            {%- set sch = schema[tpl] -%}
            {%- set ns = namespace(f={}) -%}
            {%- for fname, req in sch.fields -%}
              {%- set v = pool[loop.index0] -%}
              {%- if v not in ['', 'unknown', 'unavailable'] -%}
                {%- set ns.f = dict(ns.f, **{fname: v | trim}) -%}
              {%- elif req -%}
                {%- set ns.f = dict(ns.f, **{fname: fname}) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if icon_sel not in ['(none)', '', 'unknown', 'unavailable'] and sch.icon and 'icon' not in ns.f -%}
              {%- set ns.f = dict(ns.f, icon=icon_sel) -%}
            {%- endif -%}
            {%- if extra_raw not in ['', 'unknown', 'unavailable'] -%}
              {%- set ns.f = dict(ns.f, **(extra_raw | from_json)) -%}
            {%- endif -%}
            {{ ns.f | to_json }}
      # Sync the tape selector to what's physically loaded BEFORE rendering,
      # so the preview (and any later print) targets the real tape. A failed
      # status query never blocks a preview.
      - action: rest_command.label_printer_status
        response_variable: printer_status
        continue_on_error: true
      - if: "{{ printer_status is defined and (printer_status.content | default({}, true)) is mapping and printer_status.content.get('ok') }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.label_tape_mm
            data:
              option: "{{ printer_status.content.tape_mm }}"
      - action: script.print_label
        data:
          label_template: '{{ tpl }}'
          tape_mm: "{{ states('input_select.label_tape_mm') }}"
          send: false
          preview_path: preview.png
          extra_fields: '{{ built }}'
      # Only after a successful render: bump the token so the dashboard's
      # markdown card reloads preview.png (a failed render aborts the script
      # before this step, so a broken preview never masks the last good one).
      - action: input_text.set_value
        target:
          entity_id: input_text.label_preview_token
        data:
          value: '{{ now().timestamp() | int }}'

  label_print_from_helpers:
    alias: 'Label: Print From Helpers'
    description: >-
      Reads the Label Printer dashboard helpers, validates the template's
      required fields, and prints the label via script.print_label (send=true).
    mode: single
    icon: mdi:printer
    sequence:
      - variables:
          schema: *label_schema
          tpl: "{{ states('input_select.label_template') }}"
          pool:
            - "{{ states('input_text.label_field_1') }}"
            - "{{ states('input_text.label_field_2') }}"
            - "{{ states('input_text.label_field_3') }}"
            - "{{ states('input_text.label_field_4') }}"
            - "{{ states('input_text.label_field_5') }}"
            - "{{ states('input_text.label_field_6') }}"
            - "{{ states('input_text.label_field_7') }}"
          icon_sel: "{{ states('input_select.label_icon') }}"
          extra_raw: "{{ states('input_text.label_extra_fields') }}"
          # HA parses variable render results into native types, so `built`
          # arrives below as a dict, not a string — `missing` handles both.
          built: >-
            {%- set sch = schema[tpl] -%}
            {%- set ns = namespace(f={}) -%}
            {%- for fname, req in sch.fields -%}
              {%- set v = pool[loop.index0] -%}
              {%- if v not in ['', 'unknown', 'unavailable'] -%}
                {%- set ns.f = dict(ns.f, **{fname: v | trim}) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if icon_sel not in ['(none)', '', 'unknown', 'unavailable'] and sch.icon and 'icon' not in ns.f -%}
              {%- set ns.f = dict(ns.f, icon=icon_sel) -%}
            {%- endif -%}
            {%- if extra_raw not in ['', 'unknown', 'unavailable'] -%}
              {%- set ns.f = dict(ns.f, **(extra_raw | from_json)) -%}
            {%- endif -%}
            {{ ns.f | to_json }}
          missing: >-
            {%- set sch = schema[tpl] -%}
            {%- set f = built if built is mapping else (built | trim | from_json) -%}
            {{ sch.fields | selectattr(1) | map(attribute=0) | reject('in', f) | list | join(', ') }}
      - if: "{{ missing != '' }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.label_last_result
            data:
              value: 'Missing required fields: {{ missing }} ({{ now().strftime(''%H:%M:%S'') }})'
          - stop: 'Label print aborted: missing required fields: {{ missing }}'
            error: true
      - action: script.print_label
        data:
          label_template: '{{ tpl }}'
          tape_mm: "{{ states('input_select.label_tape_mm') }}"
          send: true
          preview_path: preview.png
          extra_fields: '{{ built }}'

  label_reset_helpers:
    alias: 'Label: Reset Helpers'
    description: Reset all Label Printer dashboard helpers to their defaults.
    mode: single
    icon: mdi:restore
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.label_template
        data:
          option: kitchen/pantry_jar
      # pantry_jar's default tape; the template-change automation re-applies
      # the default whenever the template actually changes
      - action: input_select.select_option
        target:
          entity_id: input_select.label_tape_mm
        data:
          option: '12'
      - action: input_select.select_option
        target:
          entity_id: input_select.label_icon
        data:
          option: '(none)'
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.label_field_1
            - input_text.label_field_2
            - input_text.label_field_3
            - input_text.label_field_4
            - input_text.label_field_5
            - input_text.label_field_6
            - input_text.label_field_7
            - input_text.label_extra_fields
            - input_text.label_preview_token
            - input_text.label_last_result
        data:
          value: ''
