input_text:
  # initial: '' is required — without it these boot as `unknown`, and the glue
  # script would pass the literal string "unknown" through to print_label
  # (breaking extra_fields' from_json and polluting name/date payloads).
  label_name:
    name: 'Label: Name / primary text'
    icon: mdi:text
    max: 255
    initial: ''

  label_date:
    name: 'Label: Date'
    icon: mdi:calendar-outline
    max: 100
    initial: ''

  label_extra_fields:
    name: 'Label: Extra fields (JSON object)'
    icon: mdi:code-json
    max: 255
    initial: ''

  # Internal plumbing: cache-buster for the dashboard preview image. Updated by
  # script.label_apply_from_helpers after every successful dry-run render; the
  # markdown card re-renders when this changes. Not shown on the dashboard.
  label_preview_token:
    name: 'Label: Preview token'
    icon: mdi:refresh
    max: 100
    initial: ''

script:
  label_apply_from_helpers:
    alias: 'Label: Apply From Dashboard'
    description: >-
      Reads the Label Printer dashboard helpers and runs script.print_label.
      send=false renders a dry-run preview (and bumps the preview token so the
      dashboard image refreshes); send=true prints the label.
    mode: single
    icon: mdi:label-printer
    fields:
      send:
        name: Send to printer
        description: >-
          true = actually print (POST /print). false = dry-run render saved to
          /local/labels/preview.png.
        required: true
        selector:
          boolean: {}
    sequence:
      - action: script.print_label
        data:
          label_template: "{{ states('input_select.label_template') }}"
          tape_mm: "{{ states('input_select.label_tape_mm') }}"
          send: '{{ send }}'
          name: "{{ states('input_text.label_name') }}"
          date: "{{ states('input_text.label_date') }}"
          date_preset: "{{ states('input_select.label_date_preset') }}"
          icon: "{{ '' if states('input_select.label_icon') == '(none)' else states('input_select.label_icon') }}"
          preview_path: preview.png
          extra_fields: "{{ states('input_text.label_extra_fields') }}"
      # Only after a successful preview: bump the token so the dashboard's
      # markdown card reloads preview.png (a failed render aborts the script
      # before this step, so a broken preview never masks the last good one).
      - if: '{{ not (send | bool) }}'
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.label_preview_token
            data:
              value: '{{ now().timestamp() | int }}'

  label_reset_helpers:
    alias: 'Label: Reset Helpers'
    description: Reset all Label Printer dashboard helpers to their defaults.
    mode: single
    icon: mdi:restore
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.label_template
        data:
          option: kitchen/pantry_jar
      - action: input_select.select_option
        target:
          entity_id: input_select.label_tape_mm
        data:
          option: '24'
      - action: input_select.select_option
        target:
          entity_id: input_select.label_date_preset
        data:
          option: '(none)'
      - action: input_select.select_option
        target:
          entity_id: input_select.label_icon
        data:
          option: '(none)'
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.label_name
            - input_text.label_date
            - input_text.label_extra_fields
            - input_text.label_preview_token
        data:
          value: ''
