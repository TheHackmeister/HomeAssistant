#######################################################################################################################
## Package - Label Printer
##
## Only the engine-output helpers live here. All form state is client-side in
## the label-printer-card (www/label-printer/card.js); script.print_label
## (scripts.yaml) is the engine — it queries /status for the physical tape,
## renders/prints, writes these two helpers, and bumps the preview token.
#######################################################################################################################

input_text:
  # Cache-buster for the dashboard preview image, bumped by script.print_label
  # after every successful dry-run render.
  label_preview_token:
    name: 'Label: Preview token'
    icon: mdi:refresh
    max: 100
    initial: ''

  # Last preview/print outcome, written by script.print_label on every path.
  label_last_result:
    name: 'Label: Last result'
    icon: mdi:message-text-outline
    max: 255
    initial: ''
