# https://github.com/tonylofgren/aurora-smart-home

######################################################################################################################
## Package - Label Based Features - Sleep Timeout
##
##   * script.labeled_feature_sleep_timeout - long-running "good night"
##     sequence with volume snapshot/restore; persists original volumes
##     across its `mode: restart` re-triggers via the Set Snapshot feature
##     (stored in sensor.labeled_features_state.snapshots).
##
## Depends on: package_labeled_features_generics.yaml,
##   package_labeled_features_dispatch.yaml (calls
##   script.labeled_feature_follower),
##   package_labeled_features_error_mode.yaml,
##   sensor.labeled_features_state (snapshot persistence; provided by the
##   `labeled_features` custom component since the 2026-09-26 cutover).
## External: the alert tier calls script.send_alert (defined outside these
##   packages). Invoked non-blocking (`script.turn_on`) from the dispatch
##   layer so its 15-minute delay never blocks the queued leader run.
######################################################################################################################

script:
  labeled_feature_sleep_timeout:
    alias: Labeled Feature Sleep Timeout
    description: >
      Sleep-timeout script for the Labeled Feature system. Designed to be
      dispatched via the standard Leader/Follower dispatch loop from any of
      three entry points:

        1. A button-press Leader (`Area Leader: Sleep Timer`) — primary
           trigger; the user explicitly arms the timer.
        2. A `Night` follower wiring (`Area Follower: Night` +
           `Area Night Script: script.labeled_feature_sleep_timeout`) —
           catches the case where Night is toggled off while a fade is in
           flight, with no button press.
        3. A `Media Playing` follower wiring (`Area Follower: Media Playing`
           + `Area Media Playing Script: …`) — same idea, for when the
           user pauses / stops media manually.

      Gate rule (re-evaluated fresh on every dispatch — `leader_enabled`
      from the dispatch loop is intentionally ignored):

          should_run = night_enabled AND media_playing_enabled

      Both values are read directly from
      `sensor.labeled_features_state.features[<feature>][<scope>][<scope_id>].enabled`,
      keyed by the script's `feature_night` and `feature_media_playing`
      fields (defaults: `Night` / `Media Playing`).

      Behavior:

        - should_run == false  → cancel-restore (idempotent: if no snapshot
                                 is stored, no-op). Clears the snapshot at
                                 the end.
        - should_run == true   → snapshot the media player's current volume
                                 (if no snapshot is already stored — so a
                                 `mode: restart` mid-fade preserves the
                                 original level), then run the full fade:

            1. Wait `sleep_timeout_minutes` (default 15 min)
            2. Halve the volume
            3. Wait 1 min
            4. Mute
            5. Seek back 30 s every 30 s × 20 iterations (~10 min)
            6. Unmute
            7. Restore to snapshot
            8. Clear snapshot

      The media player to act on is resolved from
      `sensor.labeled_features_state.features[<feature_media_playing>][<scope>][<scope_id>].triggering_leader`
      — i.e. whichever entity_id is currently registered as the
      `Media Playing` leader for the dispatched scope. Declare your
      bedroom media player as that leader
      (`Feature Leader`, `Area Leader: Media Playing`,
      `Area Media Playing Enable: playing`) and the script picks it up
      automatically — no `media_player` Arg required on any dispatch.
      Use the optional `media_player` field only to force a different
      target (e.g. for manual test invocations).

      `mode: restart` so the script composes cleanly with rapid re-trigger
      (button mash, Night flip during fade, etc).
    mode: restart
    fields:
      media_player:
        name: Media Player (Override)
        description: >
          Optional. When set, overrides the automatic resolution and the
          script targets this entity_id directly. Leave empty (the
          normal case) and the script reads
          `sensor.labeled_features_state.features[<feature_media_playing>][<scope>][<scope_id>].triggering_leader`
          — which is the entity_id of the bedroom media player you
          labeled `Area Leader: Media Playing`.
        required: false
        default: ''
        selector:
          entity:
            domain: media_player
      feature_night:
        name: Night Feature Name
        description: >
          Feature name to read out of
          `sensor.labeled_features_state.features` for the Night gate
          check. Default: `Night`.
        required: false
        default: Night
        selector:
          text: {}
      feature_media_playing:
        name: Media Playing Feature Name
        description: >
          Feature name to read out of
          `sensor.labeled_features_state.features` for the
          media-playing gate check. Default: `Media Playing`.
        required: false
        default: Media Playing
        selector:
          text: {}
      sleep_timeout_minutes:
        name: Sleep Timeout Minutes
        description: How long to wait before beginning the fade-out
          sequence (default 15).
        required: false
        default: 15
        selector:
          number:
            min: 1
            max: 120
      # ── Standard pass-through fields populated by the dispatch loop.
      #    Declared here so the loop's typo-tolerant arg pass-through
      #    actually lands them on this script.
      scope:
        name: Scope
        description: Passed by the leader automation. Used to look up the
          Night / Media Playing feature state in the sensor.
        required: false
        default: area
        selector:
          select:
            options:
              - area
              - floor
              - none
      scope_id:
        name: Scope ID
        description: Passed by the leader automation. The resolved
          area_id / floor_id for the gating sensor lookup.
        required: false
        default: ''
        selector:
          text: {}
      leader_entity_id:
        name: Leader Entity ID
        description: Pass-through; informational only.
        required: false
        default: ''
        selector:
          entity: {}
      follower_entity_id:
        name: Follower Entity ID
        description: Pass-through; informational only.
        required: false
        default: ''
        selector:
          entity: {}
      feature:
        name: Feature
        description: Pass-through; the dispatched feature name
          (`Sleep Timer` / `Night` / `Media Playing` depending on entry
          point).
        required: false
        default: ''
        selector:
          text: {}
      leader_feature:
        name: Leader Feature
        description: Pass-through; same as `feature` in this dispatch
          loop.
        required: false
        default: ''
        selector:
          text: {}
      leader_enabled:
        name: Leader Enabled
        description: Pass-through. Intentionally NOT used as the gate —
          the script re-reads Night and Media Playing fresh from the
          sensor on every dispatch.
        required: false
        default: true
        selector:
          boolean: {}
      toggle:
        name: Toggle
        description: Pass-through; ignored (not meaningful here).
        required: false
        default: false
        selector:
          boolean: {}
      error_mode:
        name: Error Mode
        description: silent | log | alert | stop. Used for the
          "media_player not set" guard and similar.
        required: false
        default: log
        selector:
          select:
            custom_value: true
            options:
              - silent
              - log
              - alert
              - stop
      screen_off_event:
        name: Screen-Off Event
        description: >
          Button event name that triggers the auxiliary "disable Area
          Screen" dispatch (Step 1c). When the dispatched leader's
          `sensor.labeled_features_state.leaders[<eid>].current_value`
          matches this string (case-insensitive) AND the Night gate
          passes, this script dispatches `feature: Screen` through
          `script.labeled_feature_generics` with `leader_enabled: false`
          and `toggle: false` to force every `(Area )Follower: Screen`
          entity into its disable path. Runs alongside (not instead of)
          the normal Sleep Timeout arm/cancel/restore flow.

          Set to an empty string to disable Step 1c entirely.
        required: false
        default: '1_short_release'
        selector:
          text: {}
      screen_off_feature:
        name: Screen-Off Feature
        description: >
          Feature name dispatched by the Step 1c auxiliary "disable
          screens" path. Defaults to `Screen` — the user-defined feature
          name labeled on screen entities as
          `(Area )Follower: Screen` (and optionally
          `(Area )Screen Disable: …`). Override to retarget the
          Night-press behavior at a different labeled feature.
        required: false
        default: Screen
        selector:
          text: {}
    sequence:
    # ── Step 0: read the previously-stored snapshot from
    #            `sensor.labeled_features_state.snapshots.sleep_timeout`.
    #            This is the shared persisted-state surface used by any
    #            long-running script that needs its state to survive
    #            `mode: restart` re-entries. Writes go out via
    #            `script.labeled_feature_generics` (`feature: Set
    #            Snapshot`, `snapshot_name: sleep_timeout`, `payload:
    #            {...}`); the trigger-based template sensor merges the
    #            payload into its `snapshots` attribute on the next tick.
    #
    #            We deliberately do NOT use a script local `variables:`
    #            initializer or read `state_attr(...)` on this script
    #            itself — HA does not reliably expose script `variables:`
    #            assignments as state attributes across `mode: restart`,
    #            so any snapshot stored there gets clobbered to `{}` on
    #            re-entry.
    - variables:
        _snapshots_raw: "{{ state_attr('sensor.labeled_features_state', 'snapshots') | default({}) }}"
    - variables:
        _snapshots: '{{ _snapshots_raw if _snapshots_raw is mapping else {} }}'
    - variables:
        _original_volumes_raw: '{{ _snapshots.get("sleep_timeout", {}) }}'
    # ── Step 0b: Read the snapshot timestamp for staleness detection.
    #            The timestamp is stored as `__ts__` inside the
    #            `sleep_timeout` snapshot dict. A snapshot is stale if
    #            it was written more than (sleep_timeout_minutes + 5)
    #            minutes ago — longer than any possible fade sequence.
    #            Stale snapshots are from previous tests or interrupted
    #            runs and must be ignored so Branch B doesn't "restore"
    #            to a phantom baseline.
    - variables:
        _snapshot_ts: '{{ _original_volumes_raw.get("__ts__", 0) | float(0) if _original_volumes_raw is mapping else 0 }}'
        _now_ts: '{{ now().timestamp() }}'
        _stale_threshold_seconds: '{{ ((sleep_timeout_minutes | default(15) | int) + 5) * 60 }}'
        _snapshot_age_seconds: '{{ _now_ts - _snapshot_ts }}'
        _snapshot_is_stale: '{{ _snapshot_ts > 0 and _snapshot_age_seconds > _stale_threshold_seconds }}'
    # Build original_volumes by filtering out the __ts__ key, and
    # clearing the whole thing if the snapshot is stale.
    - variables:
        original_volumes: >-
          {% if _snapshot_is_stale or not (_original_volumes_raw is mapping) %}
            {{ {} }}
          {% else %}
            {% set ns = namespace(out={}) %}
            {% for k, v in _original_volumes_raw.items() %}
              {% if k != '__ts__' %}
                {% set ns.out = dict(ns.out, **{k: v}) %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          {% endif %}
    # ── Diagnostic: log what Step 0 read so we can confirm the snapshot
    #    is visible on restart. Remove after confirming the fix.
    - action: system_log.write
      data:
        level: warning
        message: >-
          Sleep Timeout Step 0:
          snapshots_keys={{ _snapshots.keys() | list }},
          original_volumes={{ original_volumes }},
          snapshot_ts={{ _snapshot_ts }},
          snapshot_age_seconds={{ _snapshot_age_seconds | round(1) }},
          stale_threshold={{ _stale_threshold_seconds }},
          is_stale={{ _snapshot_is_stale }}

    # ── Step 1: normalize inputs and read the gate signals fresh.
    #            The media player target is resolved from the
    #            `Media Playing` feature's `triggering_leader` — i.e.
    #            whichever entity_id is currently labeled
    #            `Area Leader: Media Playing` in this scope. The
    #            `media_player` field is honored as an override when set.
    # Note: dict-typed assignments use single-quoted scalars rather than
    # `>-` folded literals. HA's template engine resolves both shapes to
    # the same string, but `>-` introduces folded newlines that combine
    # poorly with auto-native deserialization — the same workaround the
    # leaders automation uses for `trigger.to_state.attributes.features`.
    # Each downstream lookup also guards `is mapping` defensively so a
    # legacy snapshot or upstream type drift can't crash the template.
    - variables:
        _err_mode: '{{ (error_mode | default("log") | lower) }}'
        _scope: '{{ (scope | default("area") | lower) }}'
        _scope_id: '{{ scope_id | default("") | string }}'
        _feature_night: '{{ feature_night | default("Night") | trim }}'
        _feature_media_playing: '{{ feature_media_playing | default("Media Playing") | trim }}'
        _features_raw: "{{ state_attr('sensor.labeled_features_state', 'features') | default({}) }}"
    - variables:
        _features: '{{ _features_raw if _features_raw is mapping else {} }}'
    - variables:
        _night_feature_map_raw: '{{ _features.get(_feature_night, {}) }}'
        _media_playing_feature_map_raw: '{{ _features.get(_feature_media_playing, {}) }}'
    - variables:
        _night_feature_map: '{{ _night_feature_map_raw if _night_feature_map_raw is mapping else {} }}'
        _media_playing_feature_map: '{{ _media_playing_feature_map_raw if _media_playing_feature_map_raw is mapping else {} }}'
    - variables:
        _night_scope_map_raw: '{{ _night_feature_map.get(_scope, {}) }}'
        _media_playing_scope_map_raw: '{{ _media_playing_feature_map.get(_scope, {}) }}'
    - variables:
        _night_scope_map: '{{ _night_scope_map_raw if _night_scope_map_raw is mapping else {} }}'
        _media_playing_scope_map: '{{ _media_playing_scope_map_raw if _media_playing_scope_map_raw is mapping else {} }}'
    - variables:
        _night_entry_raw: '{{ _night_scope_map.get(_scope_id, {}) }}'
        _media_playing_entry_raw: '{{ _media_playing_scope_map.get(_scope_id, {}) }}'
    - variables:
        _night_entry: '{{ _night_entry_raw if _night_entry_raw is mapping else {} }}'
        _media_playing_entry: '{{ _media_playing_entry_raw if _media_playing_entry_raw is mapping else {} }}'
    - variables:
        _night_enabled: '{{ _night_entry.get("enabled", false) | bool(false) }}'
        _media_playing_enabled: '{{ _media_playing_entry.get("enabled", false) | bool(false) }}'
        _media_playing_leader: '{{ _media_playing_entry.get("triggering_leader", "") | string | trim }}'
        _media_playing_triple_exists: '{{ _media_playing_entry | length > 0 }}'
    - variables:
        # `_mp` resolution order:
        #   1. explicit `media_player` field (override path)
        #   2. `triggering_leader` from the Media Playing triple — this
        #      is the entity_id of the bedroom media player labeled
        #      `Area Leader: Media Playing`.
        _media_player_override: '{{ media_player | default("") | string | trim }}'
        _mp: '{{ _media_player_override if _media_player_override != "" else _media_playing_leader }}'
    - variables:
        _should_run: '{{ _mp != "" and _night_enabled and _media_playing_enabled }}'

    # ── Step 2 (early): Snapshot the current volume immediately after
    #            resolving _mp. This is the single source of truth for
    #            the "original" volume. It is persisted to the sensor
    #            attribute so it survives `mode: restart` re-entries.
    #            Must happen BEFORE any delay or fade so that every
    #            dispatch — including re-triggers mid-fade — has a valid
    #            baseline to restore from.
    #
    #            Gated on `_should_run`: dispatches arriving while the
    #            session is inactive (Night off or media not playing)
    #            must NOT create a baseline, or Branch B / Step 3 would
    #            later "restore" that phantom value over the user's
    #            manual volume changes. The payload carries `__ts__` so
    #            Step 0's staleness check can always retire it.
    #
    #            Also gated on volume > 0.01: capturing a muted/near-zero
    #            player as the baseline corrupts every later restore into
    #            "restore to silence". A muted player at arm time means
    #            there is no meaningful baseline to preserve.
    - if:
      - condition: template
        value_template: '{{ _should_run and _mp != "" and original_volumes | length == 0 and (state_attr(_mp, "volume_level") | float(0)) > 0.01 }}'
      then:
      - action: script.labeled_feature_generics
        data:
          feature: Set Snapshot
          snapshot_name: sleep_timeout
          payload: '{{ {_mp: state_attr(_mp, "volume_level") | float(0.5)} }}'

    # ── Step 1b: Re-trigger prelude — two branches.
    #
    # ANY dispatch arriving while a fade is in flight is treated as user
    # intervention, but the right response depends on *what the user did*:
    #
    #   Branch A — stepping interaction (Volume Up/Down hold, Lights
    #              Up/Down hold, etc):
    #     The user is actively dialing the volume (or brightness). The
    #     `Volume Up` hold loop inside `labeled_feature_generics` is
    #     running `media_player.volume_set` against the same player every
    #     300ms. If we restored to the snapshotted "original" we'd race
    #     with those writes and the volume would bounce. Instead we
    #     **re-baseline the snapshot to the current `volume_level`**:
    #     the user's new "original" is wherever they're dialing to. Idle
    #     restore-on-cancel paths (Night-off, Media-off) will then
    #     correctly restore to this new baseline, not the pre-hold value.
    #     One-tick-behind is fine — by the next Sleep Timer dispatch
    #     (typically the *_long_release event ~50–150ms after the
    #     physical release) the integration's echo has settled.
    #
    #   Branch B — discrete event (button short press, Night flip, Media
    #              Playing flip):
    #     Restore the snapshotted volume and fall through to the gate.
    #     The snapshot is NOT cleared here — it survives until the fade
    #     completes naturally (Step 6) so the fade sequence can restore
    #     to the original volume. If the gate cancels (Step 3), the
    #     restored volume is set but the snapshot persists for the next
    #     full run.
    #
    # The classifier is `_is_stepping`, which matches the canonical
    # hold-in-progress / just-released event names emitted by the IKEA
    # button families currently wired: `*_long_press`, `*_long_release`,
    # `volume_up_hold`, `volume_down_hold`, `brightness_move_up`,
    # `brightness_move_down`, `brightness_stop`. The regex
    # `(long_press|long_release|hold|_move_)` covers all of those.
    #
    # On a state-domain leader (`input_boolean.night_mode`,
    # `media_player.bedroom_main_audio`) `_trigger_state` is `on`/`off`/
    # `playing`/`paused`/etc and never matches → Branch B runs (correct).
    #
    # NOTE: we read the trigger state from
    # `sensor.labeled_features_state.leaders[<eid>].current_value`, NOT
    # from `states(eid)` directly. For `event`-domain entities (every IKEA
    # button entity in this house), `states()` returns the ISO timestamp
    # of the last event, not the event name. The sensor stores the
    # actual event name in `current_value` via the
    # `attributes.event_type | default(state)` accessor (see
    # configuration.yaml). Reading `states()` here would never match the
    # stepping regex on a button leader, causing every hold to fall
    # through to Branch B (restore) and producing the volume-bouncing-
    # at-start-of-hold bug.
    - variables:
        _leaders_raw: "{{ state_attr('sensor.labeled_features_state', 'leaders') | default({}) }}"
    - variables:
        _leaders: '{{ _leaders_raw if _leaders_raw is mapping else {} }}'
    - variables:
        _leader_entry_raw: '{{ _leaders.get(leader_entity_id, {}) }}'
    - variables:
        _leader_entry: '{{ _leader_entry_raw if _leader_entry_raw is mapping else {} }}'
    - variables:
        _trigger_state: '{{ _leader_entry.get("current_value", "") | string | lower }}'
        _is_stepping: >-
          {{ 'long_press' in _trigger_state or 'long_release' in _trigger_state or 'hold' in _trigger_state or '_move_' in _trigger_state }}

    # ── Step 1c: Configured button event in Night mode → disable Area Screen.
    # Dispatches `feature: <screen_off_feature>` directly through
    # labeled_feature_generics rather than going through `Set Feature`.
    # Rationale:
    #
    # The `Set Feature` path writes a manual-override entry into
    # `sensor.labeled_features_state.features.<F>.<scope>.<scope_id>` and
    # relies on `automation.labeled_feature_leaders` re-dispatching on the
    # attribute change. That automation's dispatch predicate gates out
    # repeat manual overrides (no `triggering_leader`, so it can't take
    # the button-bump branch) once the entry is already `enabled: false`.
    # Subsequent presses would no-op.
    #
    # Going direct via `feature: <F>` resolves followers through the
    # standard `(Area )Follower: <F>` / `(Area )Provides: <F>` mechanism
    # and dispatches per-entity through script.labeled_feature_follower
    # every time — no sensor state in the loop, so repeat presses fire
    # every time.
    #
    # `leader_enabled: false` + `toggle: false` forces the "disable" path
    # in each follower's labels.
    #
    # This runs alongside (not instead of) the normal Sleep Timeout
    # behavior — no `stop:` here. We fall through into the existing Branch
    # A/B prelude and the gate so the fade arm/cancel/restore logic
    # continues to work exactly as before. The Screen-disable just
    # piggybacks on the same dispatch.
    #
    # `_trigger_state` is sourced from
    # `sensor.labeled_features_state.leaders[<eid>].current_value` so it
    # carries the raw button event name (not the ISO timestamp that
    # `states()` returns for event-domain entities). The match is
    # case-insensitive. Set `screen_off_event` to an empty string on the
    # dispatch to disable this branch entirely.
    - variables:
        _screen_off_event: '{{ (screen_off_event | default("1_short_release") | string | lower | trim) }}'
        _screen_off_feature: '{{ (screen_off_feature | default("Screen") | string | trim) }}'
    - if:
        - condition: template
          value_template: >-
            {{ _screen_off_event != ""
               and _screen_off_feature != ""
               and _trigger_state == _screen_off_event
               and _night_enabled }}
      then:
        - action: script.labeled_feature_generics
          data:
            feature: '{{ _screen_off_feature }}'
            scope: '{{ _scope }}'
            scope_id: '{{ _scope_id }}'
            follower_entity_id: '{{ follower_entity_id | default("") }}'
            leader_entity_id: '{{ leader_entity_id | default("") }}'
            leader_enabled: false
            toggle: false
            error_mode: '{{ _err_mode }}'

    - choose:
      # ── Branch A — stepping in progress: re-baseline snapshot ────────
      - conditions:
        - condition: template
          value_template: '{{ original_volumes | length > 0 and _is_stepping and _should_run }}'
        sequence:
        # Re-read each snapshotted entity's current volume_level. The hold
        # loop in `labeled_feature_generics` writes the new absolute value
        # every 300ms; we're one tick behind it at most, which is fine —
        # the user's net interaction (start → hold → release) re-baselines
        # at both press-start and press-release, so the release dispatch
        # always carries the final committed value.
        - variables:
            original_volumes: >-
              {% set ns = namespace(out={}) %}
              {% for eid in original_volumes.keys() %}
                {% set ns.out = dict(ns.out,
                  **{eid: state_attr(eid, 'volume_level') | float(original_volumes[eid])}) %}
              {% endfor %}
              {{ ns.out }}
        - variables:
            _snapshot_payload: >-
              {% set ns = namespace(out={'__ts__': now().timestamp()}) %}
              {% for k, v in original_volumes.items() %}
                {% set ns.out = dict(ns.out, **{k: v}) %}
              {% endfor %}
              {{ ns.out }}
        - action: script.labeled_feature_generics
          data:
            feature: Set Snapshot
            snapshot_name: sleep_timeout
            payload: '{{ _snapshot_payload }}'

      # ── Branch B — discrete re-trigger: restore only ─────────────
      # Restore the snapshotted volume but DO NOT clear the snapshot.
      # The snapshot must persist so that if the script restarts again
      # (e.g., another button press during fade), the restarted instance
      # can read the original volume and restore it. The snapshot is only
      # cleared when the gate cancels (Step 3) or the fade completes (Step 6).
      - conditions:
        - condition: template
          value_template: '{{ original_volumes | length > 0 }}'
        sequence:
        # ── Diagnostic: log Branch B entry. Remove after confirming the fix.
        - action: system_log.write
          data:
            level: warning
            message: >-
              Sleep Timeout Branch B: restoring snapshot
              original_volumes={{ original_volumes }},
              current_volumes={% set ns = namespace(out={}) %}{% for eid in original_volumes.keys() %}{% set ns.out = dict(ns.out, **{eid: state_attr(eid, 'volume_level')}) %}{% endfor %}{{ ns.out }}
        - repeat:
            for_each: '{{ original_volumes.keys() | list }}'
            sequence:
            - action: media_player.volume_set
              target:
                entity_id: '{{ repeat.item }}'
              data:
                volume_level: '{{ original_volumes[repeat.item] }}'
              continue_on_error: true

    # ── Step 2: media_player resolution guard.
    #            Routed through the shared Error Mode helper so a
    #            misconfigured Media Playing leader is surfaced
    #            consistently with the rest of the stack.
    - if:
      - condition: template
        value_template: '{{ _mp == "" }}'
      then:
      - action: script.labeled_feature_error_mode
        data:
          error_mode: '{{ _err_mode }}'
          source: Labeled Feature Sleep Timeout
          message: >-
            Sleep Timeout could not resolve a media_player.
            override={{ _media_player_override or '(empty)' }};
            features[{{ _feature_media_playing }}][{{ _scope }}][{{ _scope_id }}]
            triple_exists={{ _media_playing_triple_exists }},
            triggering_leader={{ _media_playing_leader or '(empty)' }}.
            If triple_exists=False, label your media_player
            `(Area|Floor|)Leader: {{ _feature_media_playing }}` and make sure
            its `Enable:` label has fired at least once.
      - if:
        - condition: template
          value_template: '{{ _err_mode == "stop" }}'
        then:
        - stop: 'Labeled Feature Sleep Timeout: cannot resolve media_player.'
          error: true
      - stop: 'Sleep Timeout: cannot resolve media_player (handled per error_mode).'

    # ── Step 3: Cancel-restore branch.
    #            Idempotent — if no snapshot exists this is a no-op.
    #            The snapshot is NOT cleared here — it must survive until
    #            the fade completes naturally (Step 6) so that the fade
    #            sequence can restore to the original volume.
    - if:
      - condition: template
        value_template: '{{ not _should_run }}'
      then:
      - if:
        - condition: template
          value_template: '{{ original_volumes | length > 0 }}'
        then:
        # Restore the snapshot. We use `volume_set` exclusively (no
        # `volume_mute`) because the fade also uses `volume_set: 0`
        # instead of `volume_mute` (see Step 5). So whatever the
        # current volume is — original, halved, or 0 — `volume_set` to
        # the snapshot lands us back at the original level on every
        # integration regardless of whether it advertises
        # SUPPORT_VOLUME_MUTE. Simpler than the capability check and
        # bulletproof against integrations that misadvertise mute
        # support (e.g. some lnxlink / MQTT players).
        - repeat:
            for_each: '{{ original_volumes.keys() | list }}'
            sequence:
            - action: media_player.volume_set
              target:
                entity_id: '{{ repeat.item }}'
              data:
                volume_level: '{{ original_volumes[repeat.item] }}'
              continue_on_error: true
      # Clear the persisted snapshot (mirrors Step 6). The restore above already
      # put the player back to baseline, so the next arm will re-capture the
      # correct level. The zero-volume guard in Steps 2/4 prevents re-capturing
      # a muted player if the restore was dropped by a paused integration.
      - action: script.labeled_feature_generics
        data:
          feature: Set Snapshot
          snapshot_name: sleep_timeout
          payload: {}
      - variables:
          original_volumes: {}
      - stop: >-
          Sleep Timeout: cancel-restore
          (night={{ _night_enabled }}, playing={{ _media_playing_enabled }}).

    # ── Step 4: Snapshot if empty.
    #            On a `mode: restart` mid-fade Step 0 reads the previously-
    #            persisted snapshot from
    #            `sensor.labeled_features_state.snapshots.sleep_timeout`, so
    #            `original_volumes` is already non-empty and this is a no-op.
    #            On a discrete re-trigger (Branch B), the snapshot is kept
    #            intact so the restarted instance preserves the original
    #            volume baseline. Only cleared on natural completion (Step 6).
    #            Otherwise we capture the current volume_level for _mp,
    #            publish it via `Set Snapshot` so the next `mode: restart`
    #            re-entry can read it back, and update the local var for
    #            the rest of the fade.
    #            We also embed `__ts__` (Unix epoch seconds) in the snapshot
    #            dict so Step 0 can detect stale snapshots from previous
    #            tests. The `__ts__` key is filtered out at Step 0 so it
    #            never reaches the volume restore loops.
    #
    #            A muted/near-zero player is never captured as a baseline
    #            (same guard as Step 2): if no usable baseline exists at
    #            this point there is nothing to fade or restore, so the
    #            run stops instead of pinning the volume at silence.
    #
    - variables:
        original_volumes: >-
          {{ original_volumes
             if (original_volumes | length > 0)
             else ({_mp: state_attr(_mp, 'volume_level') | float(0.5)}
                   if (state_attr(_mp, 'volume_level') | float(0)) > 0.01
                   else {}) }}
    - if:
      - condition: template
        value_template: '{{ original_volumes | length == 0 }}'
      then:
      - stop: >-
          Sleep Timeout: no usable baseline volume (player muted or silent);
          skipping fade instead of snapshotting silence.
    - variables:
        _snapshot_payload: >-
          {% set ns = namespace(out={'__ts__': now().timestamp()}) %}
          {% for k, v in original_volumes.items() %}
            {% set ns.out = dict(ns.out, **{k: v}) %}
          {% endfor %}
          {{ ns.out }}
    - action: script.labeled_feature_generics
      data:
        feature: Set Snapshot
        snapshot_name: sleep_timeout
        payload: '{{ _snapshot_payload }}'
    # ── Diagnostic: confirm what was written. Remove after confirming the fix.
    - action: system_log.write
      data:
        level: warning
        message: >-
          Sleep Timeout Step 4: wrote snapshot payload={{ _snapshot_payload }},
          original_volumes={{ original_volumes }},
          _mp={{ _mp }}, current_volume={{ state_attr(_mp, 'volume_level') }}

    # ── Step 5: Fade sequence.
    #
    # No `volume_mute` calls anywhere — we use `volume_set: 0` for the
    # "mute" step and `volume_set: <snapshot>` for the restore. This is
    # simpler than capability-checking `SUPPORT_VOLUME_MUTE` and works on
    # every integration regardless of whether it correctly advertises
    # mute support (some MQTT players and lnxlink configs claim to
    # support it but the underlying device rejects the call). The
    # audible result is identical: silent during the seek-back hold,
    # restored to the original level at the end.
    #
    # Seek-back loop: see how `labeled_feature_generics` handles
    # `media_seek_back` (bitwise_and(2) on supported_features → silent
    # fallback to `media_player.media_previous_track`). We do the same
    # here. The loop ticks 20× at 0.5 s — fast enough to keep the player
    # from advancing through the queue during the brief silent hold,
    # not so slow that any seek failure stalls the script.
    - variables:
        _seek_supports: >-
          {{ (state_attr(_mp, 'supported_features') | int(0))
             | bitwise_and(2) > 0 }}
    # 5.1: Wait `sleep_timeout_minutes` before starting the fade.
    - delay:
        minutes: '{{ sleep_timeout_minutes | default(15) | int }}'
    # 5.2: Halve the volume.
    - action: media_player.volume_set
      target:
        entity_id: '{{ _mp }}'
      data:
        volume_level: >-
          {{ (original_volumes[_mp] / 2) | round(2) }}
    - delay:
        minutes: 1
    # 5.3: "Mute" via volume_set: 0 (works on every integration).
    - action: media_player.volume_set
      target:
        entity_id: '{{ _mp }}'
      data:
        volume_level: 0
    - delay:
        minutes: 1
    # 5.4: Seek-back loop — 20 × 0.5 s with 30 s of back-step each
    # iteration. This pins the player's cursor in roughly the same
    # spot during the brief mute hold so the resume doesn't land
    # somewhere unexpected. Matches the generics pattern: silently
    # falls back to `media_previous_track` when SUPPORT_SEEK is clear.
    - repeat:
        count: 20
        sequence:
        - delay:
            milliseconds: 500
        - if:
          - condition: template
            value_template: '{{ _seek_supports }}'
          then:
          - action: media_player.media_seek
            target:
              entity_id: '{{ _mp }}'
            data:
              seek_position: >-
                {{ [state_attr(_mp, 'media_position') | float(0) - 30, 0]
                   | max }}
            continue_on_error: true
          else:
          - action: media_player.media_previous_track
            target:
              entity_id: '{{ _mp }}'
            continue_on_error: true
    # 5.5: Restore the snapshot's volume FIRST, while the player is
    # still in its playing state. This guarantees the volume_set lands
    # and is committed by every integration — several integrations
    # (Music Assistant, Squeezebox, lnxlink, some MQTT players) drop or
    # ignore volume changes once the player is paused, which caused the
    # restore in the old "pause-then-restore" ordering to silently
    # no-op and leave the player at volume_set: 0 (Step 5.3's mute) on
    # the next manual play.
    #
    # This also "unmutes" the player — the previous `volume_set: 0`
    # is naturally undone by writing the snapshotted level. No separate
    # `volume_mute` call needed.
    - action: media_player.volume_set
      target:
        entity_id: '{{ _mp }}'
      data:
        volume_level: '{{ original_volumes[_mp] }}'
      continue_on_error: true
    # ── Diagnostic: confirm the restore target. Remove after confirming the fix.
    - action: system_log.write
      data:
        level: warning
        message: >-
          Sleep Timeout Step 5.5: restoring volume to {{ original_volumes[_mp] }},
          original_volumes={{ original_volumes }},
          current_volume_before={{ state_attr(_mp, 'volume_level') }}
    # 5.6: Now pause the player. By this point we've seek-back'd well
    # into the past, and the user explicitly interacted (or the gate
    # would have cancelled) so the desired end-state is silent +
    # paused at the restored volume — so the next manual play resumes
    # at the right level rather than at the muted/halved level.
    - action: media_player.media_pause
      target:
        entity_id: '{{ _mp }}'
      continue_on_error: true

    # ── Step 6: Natural completion — clear snapshot so the next fresh
    #            invocation re-snapshots from the current volume.
    - action: script.labeled_feature_generics
      data:
        feature: Set Snapshot
        snapshot_name: sleep_timeout
        payload: {}
    - variables:
        original_volumes: {}
