# Label Printer dashboard input helpers (dashboards/label-printer.yaml).
# Loaded automatically as a package via:
#   homeassistant.packages: !include_dir_named packages
# Template/icon option lists mirror script.print_label's field selectors
# (captured from GET /templates and the service's lucide icon set).
# Note: tape '3.5' truncates to int 3 via `| int` in rest_command; the API
# maps tape_mm 3 -> protocol width 4, which is the 3.5mm tape.
input_select:
  label_template:
    name: 'Label: Template'
    icon: mdi:label-outline
    initial: kitchen/pantry_jar
    options:
    - kitchen/pantry_jar
    - kitchen/spice
    - kitchen/leftover
    - kitchen/freezer
    - electronics/component_bin
    - electronics/cable_flag
    - electronics/psu_polarity
    - three_d_printing/filament_spool
    - three_d_printing/print_bin
    - three_d_printing/tool_tag
    - utility/qr
    - utility/image
    - garden/seed_packet
    - garden/plant_tag
    - garden/row_marker
    - networking/patch_port
    - networking/rack_unit
    - networking/wap_location
    - workshop/hazard
    - workshop/tool_id
    - workshop/torque_cal
    - workshop/first_aid
    - home_inventory/moving_box
    - home_inventory/warranty
    - home_inventory/storage_bin
    - media/bookshelf_tag
    - media/archive_box
    - media/cd_record
    - pet/collar_backup
    - pet/med_schedule
    - pet/food_bowl
    - travel/luggage_tag
    - travel/gear_bag
    - travel/power_bank
    - calibration/instrument_cal
    - calibration/cert_id
    - calibration/thermometer_cal
  label_tape_mm:
    name: 'Label: Tape Width'
    icon: mdi:ruler
    initial: '24'
    options:
    - '3.5'
    - '12'
    - '18'
    - '24'
  label_date_preset:
    name: 'Label: Date Preset'
    icon: mdi:calendar-clock
    initial: (none)
    options:
    - (none)
    - today
    - 1 week from today
    - 2 weeks from today
    - 1 month from today
    - 3 months from today
  label_icon:
    name: 'Label: Icon'
    icon: mdi:emoticon-outline
    initial: (none)
    options:
