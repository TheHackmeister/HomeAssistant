######################################################################################################################
## Package - Label Based Features - Dispatch layer
##
##   * automation "Labeled Feature Leaders" (id 1776536295923) - diffs
##     sensor.labeled_features_state.features and dispatches followers for
##     every (feature, scope, scope_id) triple whose `enabled` flipped.
##   * script.labeled_feature_follower - the shared follower dispatch loop.
##
## Depends on: sensor.labeled_features_state - provided by the
##   `labeled_features` custom component since the 2026-09-26 cutover
##   (the YAML template package was removed then),
##   package_labeled_features_generics.yaml,
##   package_labeled_features_error_mode.yaml.
## External: the alert error tier calls script.send_alert, which is defined
##   outside these packages; the "Labeled Feature Button" script is
##   UI-managed (entity registry, not YAML) and stays outside too.
######################################################################################################################

automation:
  - id: '1776536295923'
    alias: Labeled Feature Leaders
    description: >
      Reacts to `sensor.labeled_features_state.features` and dispatches followers
      for every (feature, scope, scope_id) entry whose `enabled` value flipped.

      Trigger: `state` on `sensor.labeled_features_state`, `attribute: features`.
      The automation diffs `trigger.from_state.attributes.features` against
      `trigger.to_state.attributes.features` and finds every entry whose
      `enabled` value changed.

      For each changed entry the automation:
        1. Identifies the dispatching leader = `entry.triggering_leader`.
           For manual overrides (`triggering_leader == ''`) the leader-label
           parsing is skipped and only the implicit feature dispatch runs.
        2. Applies runtime gates against the triggering leader's labels —
           Only, Between/Not Between, Toggle.
        3. Builds an action list from those labels (kind=script | kind=feature),
           keyed by (variant, tag). Implicit feature item auto-added unless a
           replacement-style `Script` / `Feature` label is present. Legacy
           `<F>: <state_value>` shorthand labels on the leader are translated
           into feature items targeting `<F>` with `leader_enabled=true`.
        4. Sorts by (tag, variant) — no-tag last, Enable→Normal→Disable.
        5. Filters by `enabled` (drops Enable variants when disabled and vice
           versa).
        6. Walks the array in one repeat:. For `script` items: dispatches the
           named script/automation/scene with resolved args. For `feature`
           items: resolves the follower set via the standard `(Area |Floor |)Follower:`
           + `(Area |Floor |)Provides: <DomainLabel>` resolver and calls
           `script.labeled_feature_follower` once per follower.
        7. Errors are routed through the feature's `Error Mode:` label
           (silent / log / alert / stop). `stop` halts only this feature's
           action loop; other features still dispatch.
    triggers:
    - trigger: state
      entity_id: sensor.labeled_features_state
      attribute: features
    conditions: []
    mode: queued
    max: 50
    actions:
    - variables:
        # Defensive: any of these may be non-mapping if the sensor's
        # attributes were carried over from the previous (flat) schema or
        # if something weird happened upstream. Coerce to {} so the diff
        # below is safe to walk.
        _now_features_raw: '{{ trigger.to_state.attributes.features | default({}) }}'
        _prev_features_raw: >-
          {{ (trigger.from_state.attributes.features
              if trigger.from_state is not none else {}) | default({}) }}
        _now_features: '{{ _now_features_raw if _now_features_raw is mapping else {} }}'
        _prev_features: '{{ _prev_features_raw if _prev_features_raw is mapping else {} }}'
        automation_error_mode: >-
          {% set em_label = labels('automation.labeled_feature_leaders')
              | map('label_name') | reject('none')
              | select('match', '(?i)^error mode: .+')
              | first | default('') %}
          {{ em_label | regex_replace('(?i)^error mode: ', '') | default('log', true) }}
    # Build a flat list of changed entries: every (feature, scope, scope_id)
    # whose `enabled` value differs from the previous snapshot (including
    # newly-added entries where the previous value was missing/undefined).
    # Each item carries: feature, scope, scope_id, enabled, triggering_leader,
    # last_changed_timestamp.
    - variables:
        changed_entries: >-
          {% set ns = namespace(items=[]) %}
          {% for fname, scopes_map in _now_features.items() %}
            {% set _sm = scopes_map if scopes_map is mapping else {} %}
            {% for scope_val, sids_map in _sm.items() %}
              {% set _sids = sids_map if sids_map is mapping else {} %}
              {% for scope_id_val, entry in _sids.items() %}
                {% set _entry = entry if entry is mapping else {} %}
                {% set _prev_f = _prev_features.get(fname, {}) %}
                {% set _prev_f = _prev_f if _prev_f is mapping else {} %}
                {% set _prev_s = _prev_f.get(scope_val, {}) %}
                {% set _prev_s = _prev_s if _prev_s is mapping else {} %}
                {% set prev_entry = _prev_s.get(scope_id_val, None) %}
                {% set _prev_entry = prev_entry if (prev_entry is not none and prev_entry is mapping) else none %}
                {% set prev_enabled = _prev_entry.get('enabled') if _prev_entry is not none else none %}
                {% set prev_ts = _prev_entry.get('last_changed_timestamp') if _prev_entry is not none else none %}
                {% set new_enabled = _entry.get('enabled', false) %}
                {% set new_ts = _entry.get('last_changed_timestamp') %}
                {# Dispatch predicate. Three paths into a dispatch:
                   1. First-seed entry (`prev_enabled is none`) — only
                      when the triggering leader's state is real (i.e.
                      not unknown/unavailable/none). This blocks the
                      boot-time noise where a leader's
                      unknown→real-state transition causes the sensor
                      to write its first features-entry, but with
                      `prev_enabled = none` — we'd otherwise dispatch
                      on every leader resolving from unknown on boot.
                      Manual overrides (triggering_leader == '') are
                      always real and always dispatch.
                   2. Genuine flip (`prev_enabled != new_enabled`) —
                      classic case, always dispatches.
                   3. Timestamp-only bump (`prev_ts != new_ts`) — only
                      counts when the triggering leader is a button/
                      event-domain entity. The sensor only bumps
                      timestamp-without-flip for those, so this gate
                      prevents non-button leader re-evaluations from
                      spuriously firing. #}
                {% set _trig = _entry.get('triggering_leader', '') %}
                {% set _trig_dom = (_trig | string).split('.')[0] if _trig else '' %}
                {% set _is_button = _trig_dom in ['event', 'button'] %}
                {% set _leader_state_real = (_trig | trim) == ''
                    or (states(_trig) | string | lower) not in ['unknown', 'unavailable', 'none'] %}
                {% set _is_first_seed = prev_enabled is none %}
                {% if (_is_first_seed and _leader_state_real)
                      or (not _is_first_seed and prev_enabled != new_enabled)
                      or (_is_button and prev_ts is not none and new_ts is not none and prev_ts != new_ts) %}
                  {% set ns.items = ns.items + [{
                    'feature': fname,
                    'scope': scope_val,
                    'scope_id': scope_id_val,
                    'enabled': new_enabled,
                    'triggering_leader': _entry.get('triggering_leader', ''),
                    'last_changed_timestamp': _entry.get('last_changed_timestamp', 0),
                  }] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
          {% endfor %}
          {{ ns.items | sort(attribute='feature') }}
    - repeat:
        for_each: '{{ changed_entries }}'
        sequence:
        - variables:
            _entry: '{{ repeat.item }}'
            feature_name: '{{ _entry.feature }}'
            resolved_scope: '{{ _entry.scope }}'
            resolved_scope_id: '{{ _entry.scope_id }}'
            leader_enabled: '{{ _entry.enabled }}'
            leader_entity_id: '{{ _entry.triggering_leader }}'
            # Manual overrides have an empty triggering_leader; we skip
            # all leader-label parsing and runtime gates for them and
            # only run the implicit feature dispatch.
            _is_manual_override: '{{ (leader_entity_id | trim) == "" }}'
            all_leader_labels: >-
              {% if (leader_entity_id | trim) != '' %}
                {{ labels(leader_entity_id) | map('label_name') | reject('none') | list }}
              {% else %}
                {{ [] }}
              {% endif %}
            # NOTE: `leader_current_value` is intentionally re-computed in
            # the next `variables:` block — this first definition existed
            # only as a left-over typo (passed an entire dict through
            # `dictsort` and then misused `map('first')`). It's left here
            # as `''` so anything that referenced it in this block before
            # the rebuild gets a safe default instead of a TypeError when
            # the sensor's `leaders` attribute is a mapping (which it
            # always is). Real value resolved in the next step.
            leader_current_value: ''
            # Resolve area/floor ids for downstream resolution. For
            # leader-driven entries we trust the triple's scope/scope_id.
            # For runtime label-prefix resolution we still need
            # resolved_area_id / resolved_floor_id below.
            resolved_area_id: >-
              {%- if resolved_scope == 'area' -%}{{ resolved_scope_id }}
              {%- elif (leader_entity_id | trim) != '' -%}{{ area_id(leader_entity_id) | default('', true) | trim }}
              {%- else -%}{{- '' -}}{%- endif -%}
            resolved_floor_id: >-
              {%- if resolved_scope == 'floor' -%}{{ resolved_scope_id }}
              {%- elif (leader_entity_id | trim) != '' -%}
                {%- set aid = area_id(leader_entity_id) -%}
                {%- set ns = namespace(found='') -%}
                {%- for fid in floors() -%}
                  {%- if aid in floor_areas(fid) -%}{%- set ns.found = fid -%}{%- endif -%}
                {%- endfor -%}{{ ns.found }}
              {%- else -%}{{- '' -}}{%- endif -%}
            scoped_feature_leader: '{{ (resolved_scope | capitalize + '' '') if
              resolved_scope in [''area'', ''floor''] else '''' }}{{ feature_name
              }}'
        - variables:
            # leader_current_value: pulled from the sensor's `leaders` map.
            # Used by the legacy `<F>: <state_value>` shorthand parser below.
            # `state_attr(...).get(leader_entity_id, {}).get('current_value', '')`
            # is the straightforward path — no `dictsort | items` chain
            # (which choked on mappings with the "Can only get item pairs
            # from a mapping" TypeError).
            leader_current_value: >-
              {% if (leader_entity_id | trim) != '' %}
                {% set _ldrs = state_attr('sensor.labeled_features_state', 'leaders') | default({}) %}
                {% set _ldrs = _ldrs if _ldrs is mapping else {} %}
                {% set _l = _ldrs.get(leader_entity_id, {}) %}
                {% set _l = _l if _l is mapping else {} %}
                {{ _l.get('current_value', '') | string }}
              {% else %}{{ '' }}{% endif %}
            leader_only: "{% set only_label = scoped_feature_leader + ' Only: ' %}
              {% set match = all_leader_labels
                  | select('match', '^' + only_label + '(Enable|Disable)$')
                  | first | default('') %}
              {{ match | regex_replace('^.+: ', '') }}"
            leader_between: "{{ all_leader_labels
              | select('match', '^' + scoped_feature_leader + ' Between: .+')
              | map('regex_replace', '^.+: ', '') | list }}"
            leader_not_between: "{{ all_leader_labels
              | select('match', '^' + scoped_feature_leader + ' Not Between: .+')
              | map('regex_replace', '^.+: ', '') | list }}"
            leader_time_ok: '{% set now_time = now().strftime(''%H:%M'') %} {% set
              ns = namespace(ok=true, any_b=false) %} {% for val in leader_between
              %} {% set p = val.split('':'') %} {% set s = p[0]+'':''+p[1] if (p|length==4
              or (p|length==3 and p[2]==''-'')) and p[0]!=''-'' else ''-'' %} {%
              set e = p[2]+'':''+p[3] if p|length==4 else (p[1]+'':''+p[2] if p|length==3
              and p[0]==''-'' else ''-'') %} {% set in_r = ((s==''-'' or now_time>=s)
              and (e==''-'' or now_time<=e)) if (s==''-'' or e==''-'' or s<=e) else
              (now_time>=s or now_time<=e) %} {% if in_r %}{% set ns.any_b = true
              %}{% endif %} {% endfor %} {% if leader_between|length > 0 %}{% set
              ns.ok = ns.any_b %}{% endif %} {% for val in leader_not_between %}
              {% set p = val.split('':'') %} {% set s = p[0]+'':''+p[1] if (p|length==4
              or (p|length==3 and p[2]==''-'')) and p[0]!=''-'' else ''-'' %} {%
              set e = p[2]+'':''+p[3] if p|length==4 else (p[1]+'':''+p[2] if p|length==3
              and p[0]==''-'' else ''-'') %} {% set in_r = ((s==''-'' or now_time>=s)
              and (e==''-'' or now_time<=e)) if (s==''-'' or e==''-'' or s<=e) else
              (now_time>=s or now_time<=e) %} {% if in_r %}{% set ns.ok = false
              %}{% endif %} {% endfor %} {{ ns.ok }}'
            leader_toggle: '{{ (scoped_feature_leader + " Toggle: True") in all_leader_labels }}'
            # leader_should_proceed: runtime gate. Manual overrides bypass
            # all of these (the entry already represents the intended
            # value), so we early-out when there's no triggering leader.
            # Direction labels (Increasing/Decreasing) are already applied
            # in the sensor — we no longer need to filter them here.
            leader_should_proceed: '{% if (leader_entity_id | trim) == "" %} true
              {% elif leader_toggle %} true
              {% elif leader_only == "Enable" and not leader_enabled %} false
              {% elif leader_only == "Disable" and leader_enabled %} false
              {% elif not leader_time_ok %} false
              {% else %} true {% endif %}'
            feature_error_mode: "{% set pfx = scoped_feature_leader + ' Error Mode: ' %}
              {% set match = all_leader_labels
                  | select('match', '^' + pfx + '(silent|log|alert|stop)$')
                  | first | default('') %}
              {{ match | regex_replace('^.+: ', '') | default(automation_error_mode, true) }}"
            # Script Call Mode — resolved from labels on
            # `sensor.labeled_features_state` (NOT the leader entity).
            # Priority (highest first):
            #   1. `<scope_prefix><F> Script Call Mode: <X>`
            #   2. `<F> Script Call Mode: <X>`
            #   3. `Script Call Mode: <X>`               (sensor-wide default)
            #   4. Hardcoded fallback: Blocking
            # `<X>` ∈ `Blocking | NonBlocking` (case-insensitive match).
            # Affects only the `script.*` dispatch branch below — when
            # NonBlocking, the script is fired via `script.turn_on` so
            # the leader automation's queued iteration doesn't wait for
            # the script to complete. Safe only for scripts whose mode is
            # `parallel` or `restart` (otherwise script.turn_on still
            # blocks). `automation.*` and `scene.*` refs are unaffected.
            feature_script_call_mode: >-
              {% set sensor_labels = labels('sensor.labeled_features_state')
                  | map('label_name') | reject('none') | list %}
              {% set scoped_pfx = scoped_feature_leader ~ ' Script Call Mode: ' %}
              {% set bare_pfx = feature_name ~ ' Script Call Mode: ' %}
              {% set global_pfx = 'Script Call Mode: ' %}
              {% set scoped_match = sensor_labels
                  | select('match', '^' ~ scoped_pfx ~ '(Blocking|NonBlocking)$')
                  | first | default('') %}
              {% set bare_match = sensor_labels
                  | select('match', '^' ~ bare_pfx ~ '(Blocking|NonBlocking)$')
                  | first | default('') %}
              {% set global_match = sensor_labels
                  | select('match', '^' ~ global_pfx ~ '(Blocking|NonBlocking)$')
                  | first | default('') %}
              {% set picked = scoped_match if scoped_match != ''
                  else (bare_match if bare_match != ''
                  else (global_match if global_match != '' else '')) %}
              {% set normalized = picked | regex_replace('^.+: ', '') %}
              {{ 'NonBlocking' if normalized == 'NonBlocking'
                  else ('Blocking' if normalized == 'Blocking' else 'Blocking') }}
            leader_feature_overrides: "{% set cv = leader_current_value | trim %}
              {% if cv != '' and (leader_entity_id | trim) != '' %}
                {% set ns = namespace(features=[]) %}
                {% for lbl in all_leader_labels %}
                  {% if lbl | regex_search(': ' + cv + '$') %}
                    {% set prefix_raw = lbl | regex_replace(': ' + cv + '$', '') | trim %}
                    {% set prefix = prefix_raw | regex_replace('^(Area |Floor )', '') | trim %}
                    {% if not prefix | regex_search('^(Area |Floor |)Leader')
                          and not prefix | regex_search('^(Area |Floor |)Follower')
                          and not prefix | regex_search('^Feature')
                          and not prefix | regex_search(' (Enable|Disable|Invert|Only|Script|Error Mode)$')
                          and not prefix | regex_search(' (Between|Not Between|Increasing|Decreasing)$')
                          and not prefix | regex_search(' Arg ') %}
                      {% set ns.features = ns.features + [prefix] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.features }}
              {% else %}{{ [] }}{% endif %}"
        - condition: template
          value_template: '{{ leader_should_proceed }}'

        # ─────────────────────────────────────────────────────────────
        # Step 2 — Build the action list from labels (leader entity).
        # Mirrors the follower's parser: regex_search + regex_replace
        # per label to extract variant / extra / kind / tag / ref.
        # Plus the legacy `<F>: <state_value>` shorthand on a leader
        # is also translated into a feature item targeting <F>.
        # ─────────────────────────────────────────────────────────────
        - variables:
            _label_actions: >-
              {% set ns = namespace(items=[]) %}
              {% set sf = scoped_feature_leader %}
              {% set base_re = '^' ~ sf ~ ' (Enable |Disable )?(Extra )?(Script|Feature)( \\S+)?: .+$' %}
              {% for lbl in all_leader_labels %}
                {% if lbl | regex_search(base_re) %}
                  {% set variant = 'enable' if (lbl | regex_search('^' ~ sf ~ ' Enable '))
                                   else ('disable' if (lbl | regex_search('^' ~ sf ~ ' Disable '))
                                         else 'normal') %}
                  {% set extra = lbl | regex_search('^' ~ sf ~ ' (Enable |Disable )?Extra ') %}
                  {% set kind_word = ('script'
                    if (lbl | regex_search('^' ~ sf ~ ' (Enable |Disable )?(Extra )?Script( |:)'))
                    else 'feature') %}
                  {% set kw = 'Script' if kind_word == 'script' else 'Feature' %}
                  {% set tag_pat = '^' ~ sf ~ ' (Enable |Disable )?(Extra )?' ~ kw ~ ' (\\S+): ' %}
                  {% set tag_match = lbl | regex_findall(tag_pat) %}
                  {% set tag = '' %}
                  {% if tag_match | length > 0 %}
                    {% set first = tag_match[0] %}
                    {% if first is string %}{% set tag = first | trim %}
                    {% else %}{% set tag = first[-1] | trim %}{% endif %}
                  {% endif %}
                  {% set ref = lbl | regex_replace('^[^:]+: ', '') | trim %}
                  {% set ns.items = ns.items + [{
                    'kind': kind_word,
                    'replaces_implicit': (not extra),
                    'variant': variant,
                    'tag': tag,
                    'ref': ref
                  }] %}
                {% endif %}
              {% endfor %}
              {{ ns.items }}
            # ── Arg pool keyed by (variant, tag).
            # Substitution syntax:  <attribute>.<dotted.path>
            #   - Must match ^[A-Za-z_][A-Za-z0-9_]*\.
            #   - First segment names a top-level attribute on
            #     sensor.labeled_features_state.
            #   - Walks the remaining segments through nested dicts.
            #   - Empty segment ('..') is a literal empty-string key
            #     (used for global scope's '' scope_id).
            #   - Special case for `leaders`: if the first path
            #     segment is not already a key in `leaders` dict,
            #     splice the triggering leader_entity_id in as the
            #     first key.
            _arg_pools: >-
              {% set _sensor_attrs = states['sensor.labeled_features_state'].attributes
                                     if states['sensor.labeled_features_state'] is not none else {} %}
              {% set sf = scoped_feature_leader %}
              {% set arg_re = '^' ~ sf ~ ' (Enable |Disable )?Arg(?: \\S+)? \\S+: .+$' %}
              {% set sub_re = '^[A-Za-z_][A-Za-z0-9_]*\\.' %}
              {% set ns = namespace(pools={}) %}
              {% for lbl in all_leader_labels %}
                {% if lbl | regex_search(arg_re) %}
                  {% set variant = 'enable' if (lbl | regex_search('^' ~ sf ~ ' Enable Arg'))
                                   else ('disable' if (lbl | regex_search('^' ~ sf ~ ' Disable Arg'))
                                         else 'normal') %}
                  {% if variant == 'normal' %}
                    {% set after_arg = lbl | regex_replace('^' ~ sf ~ ' Arg ', '') %}
                  {% else %}
                    {% set vw = 'Enable' if variant == 'enable' else 'Disable' %}
                    {% set after_arg = lbl | regex_replace('^' ~ sf ~ ' ' ~ vw ~ ' Arg ', '') %}
                  {% endif %}
                  {% set head = after_arg | regex_replace(':.*$', '') %}
                  {% set toks = head.split() %}
                  {% if toks | length >= 2 %}
                    {% set tag = toks[0] | trim %}
                    {% set field_raw = toks[1] | trim %}
                  {% else %}
                    {% set tag = '' %}
                    {% set field_raw = toks[0] | trim %}
                  {% endif %}
                  {% set raw = lbl | regex_replace('^[^:]+: ', '') | trim %}
                  {% if raw | regex_search(sub_re) %}
                    {% set parts = raw.split('.') %}
                    {% set attr_name = parts[0] %}
                    {% set path = parts[1:] %}
                    {% set cur_ns = namespace(v=_sensor_attrs.get(attr_name, none)) %}
                    {% if attr_name == 'leaders' and path | length > 0
                          and cur_ns.v is not none
                          and (path[0] not in cur_ns.v)
                          and (leader_entity_id | trim) != '' %}
                      {% set cur_ns.v = cur_ns.v.get(leader_entity_id, none) %}
                    {% endif %}
                    {% for seg in path %}
                      {% if cur_ns.v is mapping %}
                        {% set cur_ns.v = cur_ns.v.get(seg, none) %}
                      {% else %}
                        {% set cur_ns.v = none %}
                      {% endif %}
                    {% endfor %}
                    {% set resolved = (cur_ns.v if cur_ns.v is not none else raw) | string %}
                  {% else %}
                    {% set resolved = raw %}
                  {% endif %}
                  {% set pool_key = variant ~ '||' ~ tag %}
                  {% set existing = ns.pools.get(pool_key, {}) %}
                  {% set ns.pools = dict(ns.pools, **{pool_key: dict(existing, **{field_raw: resolved})}) %}
                {% endif %}
              {% endfor %}
              {{ ns.pools }}
            # Legacy `<F>: <state_value>` shorthand on leaders.
            #
            # NB: filter `ovr == feature_name`. The shorthand items carry
            # `replaces_implicit: true` so they suppress the current
            # feature's implicit dispatch. Without this guard, when one
            # leader carries shorthand labels for *multiple* features
            # (e.g. `Day: Day` and `Night: Night` on input_select.house_mode)
            # the shorthand resolved for the leader's current state would
            # also drop the implicit item on every *other* feature's
            # triple flipping on the same tick — so a Night → Day transition
            # would silently skip dispatching the Night feature with
            # `leader_enabled = false`. The shorthand is conceptually about
            # "when state == X, dispatch feature X", so only the matching
            # feature's iteration should see the shorthand item.
            _shorthand_features: >-
              {% set ns = namespace(items=[]) %}
              {% for ovr in leader_feature_overrides %}
                {% if ovr == feature_name %}
                  {% set ovr_toggle = (ovr + ' Toggle: True') in all_leader_labels %}
                  {% set ns.items = ns.items + [{
                    'kind': 'feature',
                    'replaces_implicit': true,
                    'variant': 'normal',
                    'tag': '',
                    'ref': ovr,
                    'shorthand': true,
                    'shorthand_toggle': ovr_toggle
                  }] %}
                {% endif %}
              {% endfor %}
              {{ ns.items }}
            _has_replacement: >-
              {{ (_label_actions + _shorthand_features)
                 | selectattr('replaces_implicit', 'equalto', true)
                 | list | length > 0 }}
        - variables:
            _action_list: >-
              {%- set implicit = [] -%}
              {%- if not _has_replacement -%}
                {%- set implicit = [{
                  'kind': 'feature',
                  'replaces_implicit': false,
                  'variant': 'normal',
                  'tag': '',
                  'ref': '',
                  'implicit': true
                }] -%}
              {%- endif -%}
              {{ _label_actions + _shorthand_features + implicit }}

        # ─────────────────────────────────────────────────────────────
        # Step 3 — Sort by (tag, variant). Step 4 — filter by state.
        # ─────────────────────────────────────────────────────────────
        - variables:
            _variant_rank: >-
              {{ {'enable': 0, 'normal': 1, 'disable': 2} }}
            sorted_actions: >-
              {%- set ns = namespace(annotated=[]) -%}
              {%- for it in _action_list -%}
                {%- set tag = it.tag | default('') -%}
                {%- set tag_bucket = 1 if tag == '' else 0 -%}
                {%- set tag_key = tag if tag != '' else '~~' -%}
                {%- set variant_key = _variant_rank.get(it.variant | default('normal'), 1) -%}
                {%- set ns.annotated = ns.annotated + [
                  dict(it, **{
                    '_tag_bucket': tag_bucket,
                    '_tag_key': tag_key,
                    '_variant_key': variant_key
                  })
                ] -%}
              {%- endfor -%}
              {{ ns.annotated
                 | sort(attribute='_variant_key')
                 | sort(attribute='_tag_key')
                 | sort(attribute='_tag_bucket') }}
            filtered_actions: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for it in sorted_actions -%}
                {%- set v = it.variant | default('normal') -%}
                {%- if v == 'enable' and not (leader_enabled | bool) -%}
                {%- elif v == 'disable' and (leader_enabled | bool) -%}
                {%- else -%}
                  {%- set ns.out = ns.out + [it] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _scope_pfx: >-
              {{ 'Area ' if resolved_scope == 'area' else ('Floor ' if resolved_scope == 'floor' else '') }}
            scope_entity_set: >-
              {% if resolved_scope == 'area' and resolved_area_id != '' %}
                {% set area_ents = area_entities(resolved_area_id) | list %}
                {% set area_devs = area_devices(resolved_area_id) %}
                {% set ns = namespace(dev_ents=[]) %}
                {% for d in area_devs %}
                  {% set ns.dev_ents = ns.dev_ents + device_entities(d) | list %}
                {% endfor %}
                {{ (area_ents + ns.dev_ents) | unique | list }}
              {% elif resolved_scope == 'floor' and resolved_floor_id != '' %}
                {% set ns = namespace(ents=[]) %}
                {% for a in floor_areas(resolved_floor_id) %}
                  {% set ns.ents = ns.ents + area_entities(a) | list %}
                  {% for d in area_devices(a) %}
                    {% set ns.ents = ns.ents + device_entities(d) | list %}
                  {% endfor %}
                {% endfor %}
                {{ ns.ents | unique | list }}
              {% else %}
                {{ [] }}
              {% endif %}
            _std_fields_base: >-
              {{ {'leader_entity_id': leader_entity_id,
                  'feature': feature_name,
                  'leader_feature': feature_name,
                  'leader_enabled': leader_enabled,
                  'scope': resolved_scope,
                  'scope_id': resolved_scope_id} }}

        # ─────────────────────────────────────────────────────────────
        # Step 5 — Execute the action loop.
        # ─────────────────────────────────────────────────────────────
        - repeat:
            for_each: '{{ filtered_actions }}'
            sequence:
            - variables:
                _it: '{{ repeat.item }}'
                _args: >-
                  {{ _arg_pools.get(((_it.variant | default('normal')) ~ '||' ~ (_it.tag | default(''))), {}) }}

            - choose:
              # ───────── script kind ─────────
              - conditions:
                  - condition: template
                    value_template: '{{ _it.kind == "script" }}'
                sequence:
                - if:
                  - condition: template
                    value_template: '{{ (_it.ref | default("") | string | trim) == "" }}'
                  then:
                  - action: script.labeled_feature_error_mode
                    data:
                      error_mode: '{{ feature_error_mode }}'
                      source: Labeled Feature Leaders
                      message: >-
                        Empty script ref in action item (variant={{ _it.variant }},
                        tag={{ _it.tag }}) for {{ leader_entity_id }} (feature: {{ feature_name }}).
                  - stop: 'LF Leaders: empty script ref (handled per error_mode).'
                - if:
                  - condition: template
                    value_template: '{{ _it.ref.startswith("automation.") or _it.ref.startswith("scene.") }}'
                  then:
                  # `automation.*` / `scene.*` refs are unaffected by
                  # Script Call Mode. `automation.trigger` returns
                  # quickly; `scene.turn_on` is inherently fire-and-
                  # forget. Both are safe to invoke directly.
                  - action: '{{ _it.ref }}'
                    data: {}
                    continue_on_error: true
                  else:
                  # `script.*` ref. Branch on Script Call Mode:
                  #   - blocking (default): invoke directly so the
                  #     outer for_each iteration awaits completion.
                  #     Preserves current semantics — any downstream
                  #     work that depends on the script having finished
                  #     keeps working.
                  #   - nonblocking: invoke via `script.turn_on`, which
                  #     fire-and-forgets when the target script's mode
                  #     is `parallel` or `restart`. Required for long-
                  #     running scripts (e.g. `labeled_feature_sleep_timeout`
                  #     with its 15-minute delay) so they don't block
                  #     the leader automation's queued iteration.
                  - variables:
                      _all_args: '{{ _args or {} }}'
                  - if:
                    - condition: template
                      value_template: '{{ feature_script_call_mode == "NonBlocking" }}'
                    then:
                    - action: script.turn_on
                      target:
                        entity_id: '{{ _it.ref | trim }}'
                      data:
                        variables: '{{ _std_fields_base | combine(_all_args | default({})) }}'
                      continue_on_error: true
                    else:
                    - choose:
                      - conditions:
                          - condition: template
                            value_template: '{{ _all_args | length == 0 }}'
                        sequence:
                        - action: '{{ _it.ref }}'
                          data: '{{ _std_fields_base }}'
                          continue_on_error: true
                      default:
                      - action: script.turn_on
                        target:
                          entity_id: '{{ _it.ref | trim }}'
                        data:
                          variables: '{{ _std_fields_base | combine(_all_args) }}'
                        continue_on_error: true

              # ───────── feature kind ─────────
              - conditions:
                  - condition: template
                    value_template: '{{ _it.kind == "feature" }}'
                sequence:
                - variables:
                    _target_feature: >-
                      {{ _it.ref if (_it.ref | default('') | trim != '') else feature_name }}
                    _it_toggle: >-
                      {{ _it.shorthand_toggle if (_it.shorthand | default(false)) else leader_toggle }}
                    _follower_label_name: >-
                      {%- if resolved_scope == 'area' -%}Area Follower: {{ _target_feature }}
                      {%- elif resolved_scope == 'floor' -%}Floor Follower: {{ _target_feature }}
                      {%- else -%}Follower: {{ _target_feature }}{%- endif -%}
                    _target_catalog: >-
                      {% set catalog = state_attr('sensor.labeled_features_state', 'feature_meta') | default({}) %}
                      {{ catalog.get(_target_feature, {}) }}
                    _target_domain_label: '{{ _target_catalog.get("domain_label", "") }}'
                    _provides_followers: >-
                      {% if _target_domain_label == '' %}
                        {{ [] }}
                      {% else %}
                        {% set bare_lbl = 'Provides: ' ~ _target_domain_label %}
                        {% set scoped_lbl = _scope_pfx ~ 'Provides: ' ~ _target_domain_label %}
                        {{ ((label_entities(bare_lbl) | list)
                            + (label_entities(scoped_lbl) | list)) | unique | list }}
                      {% endif %}
                    _all_followers: >-
                      {% set all_f = (label_entities(_follower_label_name) | list
                                      + _provides_followers) | unique | list %}
                      {% if scope_entity_set | length > 0 %}
                        {{ all_f | select('in', scope_entity_set) | list }}
                      {% else %}
                        {{ all_f }}
                      {% endif %}

                - repeat:
                    for_each: '{{ _all_followers }}'
                    sequence:
                    # Per-follower dispatch honors Script Call Mode too.
                    # `script.labeled_feature_follower` is mode:parallel,
                    # so script.turn_on fire-and-forgets cleanly. Default
                    # (Blocking) preserves historical await-each behavior;
                    # NonBlocking unblocks the leader's outer for_each so
                    # fan-out to many followers doesn't serialize behind
                    # the slowest follower's work.
                    - if:
                      - condition: template
                        value_template: '{{ feature_script_call_mode == "NonBlocking" }}'
                      then:
                      - action: script.turn_on
                        target:
                          entity_id: script.labeled_feature_follower
                        data:
                          variables:
                            follower_entity_id: '{{ repeat.item }}'
                            feature: '{{ _target_feature }}'
                            leader_entity_id: '{{ leader_entity_id }}'
                            leader_enabled: '{{ leader_enabled }}'
                            toggle: '{{ _it_toggle | default(false) }}'
                            error_mode: '{{ feature_error_mode }}'
                            scope: '{{ resolved_scope }}'
                            scope_id: '{{ resolved_scope_id }}'
                        continue_on_error: true
                      else:
                      - action: script.labeled_feature_follower
                        data:
                          follower_entity_id: '{{ repeat.item }}'
                          feature: '{{ _target_feature }}'
                          leader_entity_id: '{{ leader_entity_id }}'
                          leader_enabled: '{{ leader_enabled }}'
                          toggle: '{{ _it_toggle | default(false) }}'
                          error_mode: '{{ feature_error_mode }}'
                          scope: '{{ resolved_scope }}'
                          scope_id: '{{ resolved_scope_id }}'
                        continue_on_error: true

            # ── Per-iteration error routing ──
            - if:
              - condition: template
                value_template: '{{ error is defined }}'
              then:
              - if:
                - condition: template
                  value_template: '{{ feature_error_mode == "log" }}'
                then:
                - action: system_log.write
                  data:
                    level: error
                    message: >-
                      Labeled Feature Leaders: action error (kind={{ _it.kind }},
                      ref={{ _it.ref }}, tag={{ _it.tag }}, variant={{ _it.variant }})
                      for {{ leader_entity_id }} (feature: {{ feature_name }}): {{ error }}
              - if:
                - condition: template
                  value_template: '{{ feature_error_mode == "alert" }}'
                then:
                - action: script.send_alert
                  data:
                    alert_severity: high
                    alert_title: Labeled Feature Leaders Error
                    alert_message: >-
                      Action error (kind={{ _it.kind }}, ref={{ _it.ref }},
                      tag={{ _it.tag }}) for {{ leader_entity_id }}
                      (feature: {{ feature_name }}): {{ error }}
              - if:
                - condition: template
                  value_template: '{{ feature_error_mode == "stop" }}'
                then:
                - stop: 'Labeled Feature Leaders: halted on {{ _it.ref }} (feature: {{ feature_name }})'
                  error: true

script:
  labeled_feature_follower:
    alias: Labeled Feature Follower
    description: >
      Implements The Dispatch Loop (see Label Based Features.md) against the
      follower entity's labels for the named feature. Builds a single ordered
      list of action items from labels, sorts by (tag, variant), filters by
      follower_enabled, and walks the list in one repeat:. For each item:
        - kind=script: dispatches script/automation/scene with resolved args.
        - kind=feature (self+implicit): runs the direct entity action (light/
          switch/media_player/select/number/text/toggle/etc).
        - kind=feature (cross-feature): routes through labeled_feature_generics.
        - kind=feature (self+non-implicit): documented no-op.
    mode: parallel
    max: 50
    fields:
      follower_entity_id:
        name: Follower Entity ID
        description: The follower entity to act on
        required: true
        selector:
          entity: {}
      feature:
        name: Feature
        description: The feature name (e.g. 'night', 'screen')
        required: true
        selector:
          text: {}
      leader_entity_id:
        name: Leader Entity ID
        description: The leader that triggered this (optional, for reference)
        required: false
        default: ''
        selector:
          entity: {}
      leader_enabled:
        name: Leader Enabled
        description: Post-evaluated leader enabled boolean, passed from the automation
        required: true
        selector:
          boolean: {}
      error_mode:
        name: Error Mode
        description: 'Default error mode when the follower entity has no `<feature>
          Error Mode:` label. Passed in by the leader automation from its per-feature
          evaluation. Priority: follower entity label → this field → ''log''. Tiers:
          silent | log | alert | stop.

          '
        required: false
        default: ''
        selector:
          select:
            custom_value: true
            options:
            - silent
            - log
            - alert
            - stop
      toggle:
        name: Toggle
        description: 'When true, the follower will toggle its current state instead
          of setting it to a specific value. Invert is ignored in toggle mode. Direct-value
          labels are skipped; Script and Extra Script items still run with toggle passed
          as an additional field. For domains without toggle support, Error Mode handling
          applies.

          '
        required: false
        default: false
        selector:
          boolean: {}
      scope:
        name: Scope
        description: Scope of the feature (area, floor, or none).
        required: false
        selector:
          select:
            options:
            - area
            - floor
            - none
      scope_id:
        name: Scope ID
        description: The area_id or floor_id that corresponds to the resolved scope.
        required: false
        default: ''
        selector:
          text: {}
    sequence:
    # ─────────────────────────────────────────────────────────────────────
    # Step 0 — Setup
    # ─────────────────────────────────────────────────────────────────────
    - variables:
        feature_name: '{{ feature }}'
        follower_labels: >-
          {{ labels(follower_entity_id) | map('label_name') | reject('none') | list }}
        follower_domain: '{{ follower_entity_id.split(".")[0] }}'
    - variables:
        scoped_feature: >-
          {{ (scope | default('') | capitalize + ' ') if scope | default('') in ['area', 'floor'] else '' }}{{ feature_name }}
        follower_error_mode: >-
          {% set em_pfx = scoped_feature + ' Error Mode: ' %}
          {% set match = follower_labels | select('match', '^' + em_pfx + '(silent|log|alert|stop)$') | first | default('') %}
          {% set from_label = match | regex_replace('^.+: ', '') | lower %}
          {% if from_label != '' %}{{ from_label }}
          {% elif (error_mode | default('') | lower) != '' %}{{ error_mode | lower }}
          {% else %}log{% endif %}
        follower_inverted: '{{ (scoped_feature + " Invert: True") in follower_labels }}'
        follower_enabled: '{{ (not leader_enabled) if follower_inverted else leader_enabled }}'
        follower_toggle: '{{ (toggle | default(false) | bool) or ((scoped_feature + " Toggle: True") in follower_labels) }}'
    - variables:
        follower_only: >-
          {% set only_label = scoped_feature + ' Only: ' %}
          {% set match = follower_labels | select('match', '^' + only_label + '(Enable|Disable)$') | first | default('') %}
          {{ match | regex_replace('^.+: ', '') }}
        follower_between: >-
          {{ follower_labels | select('match', '^' + scoped_feature + ' Between: .+')
             | map('regex_replace', '^.+: ', '') | list }}
        follower_not_between: >-
          {{ follower_labels | select('match', '^' + scoped_feature + ' Not Between: .+')
             | map('regex_replace', '^.+: ', '') | list }}
        follower_time_ok: >-
          {% set now_time = now().strftime('%H:%M') %}
          {% set ns = namespace(ok=true, any_b=false) %}
          {% for val in follower_between %}
            {% set p = val.split(':') %}
            {% set s = p[0]+':'+p[1] if (p|length==4 or (p|length==3 and p[2]=='-')) and p[0]!='-' else '-' %}
            {% set e = p[2]+':'+p[3] if p|length==4 else (p[1]+':'+p[2] if p|length==3 and p[0]=='-' else '-') %}
            {% set in_r = ((s=='-' or now_time>=s) and (e=='-' or now_time<=e)) if (s=='-' or e=='-' or s<=e) else (now_time>=s or now_time<=e) %}
            {% if in_r %}{% set ns.any_b = true %}{% endif %}
          {% endfor %}
          {% if follower_between|length > 0 %}{% set ns.ok = ns.any_b %}{% endif %}
          {% for val in follower_not_between %}
            {% set p = val.split(':') %}
            {% set s = p[0]+':'+p[1] if (p|length==4 or (p|length==3 and p[2]=='-')) and p[0]!='-' else '-' %}
            {% set e = p[2]+':'+p[3] if p|length==4 else (p[1]+':'+p[2] if p|length==3 and p[0]=='-' else '-') %}
            {% set in_r = ((s=='-' or now_time>=s) and (e=='-' or now_time<=e)) if (s=='-' or e=='-' or s<=e) else (now_time>=s or now_time<=e) %}
            {% if in_r %}{% set ns.ok = false %}{% endif %}
          {% endfor %}
          {{ ns.ok }}
        follower_should_act: >-
          {%- set only = follower_only | trim | lower -%}
          {%- if only == 'enable' and not leader_enabled -%}false
          {%- elif only == 'disable' and leader_enabled -%}false
          {%- elif only != '' and only not in ['enable', 'disable'] -%}false
          {%- elif not follower_time_ok -%}false
          {%- else -%}true
          {%- endif -%}
    - condition: template
      value_template: '{{ follower_should_act }}'

    # ─────────────────────────────────────────────────────────────────────
    # Step 2 — Build the action list from labels
    #
    # Per-label parsing uses regex_search + regex_replace to extract each
    # field one at a time — same pattern used elsewhere in this codebase
    # (Pre/Main/Post Script blocks, Arg blocks, etc.). This is more
    # verbose than regex_findall + tuple indexing but matches the rest of
    # the codebase and is known to work in HA's Jinja sandbox.
    #
    # Recognized label shapes (anchored to the scoped feature prefix):
    #   <sf> (Enable |Disable )?(Extra )?Script( <tag>)?: <ref>
    #   <sf> (Enable |Disable )?(Extra )?Feature( <tag>)?: <ref>
    #
    # _label_actions items:
    #   {kind, replaces_implicit, variant, tag, ref}
    #     kind: 'script' | 'feature'
    #     variant: 'enable' | 'disable' | 'normal'
    #     tag: string (empty when no tag)
    #     ref: target script/automation/scene ref or referenced feature name
    # ─────────────────────────────────────────────────────────────────────
    - variables:
        _label_actions: >-
          {% set ns = namespace(items=[]) %}
          {% set sf = scoped_feature %}
          {# Anchored shape: <sf> [Enable|Disable ][Extra ]<Script|Feature>[ <tag>]: <ref> #}
          {% set base_re = '^' ~ sf ~ ' (Enable |Disable )?(Extra )?(Script|Feature)( \\S+)?: .+$' %}
          {% for lbl in follower_labels %}
            {% if lbl | regex_search(base_re) %}
              {# Variant qualifier (optional). #}
              {% set var_match = lbl | regex_search('^' ~ sf ~ ' (Enable|Disable) ') %}
              {% set variant = 'enable' if (lbl | regex_search('^' ~ sf ~ ' Enable '))
                               else ('disable' if (lbl | regex_search('^' ~ sf ~ ' Disable '))
                                     else 'normal') %}
              {# Replacement vs additive. #}
              {% set extra = lbl | regex_search('^' ~ sf ~ ' (Enable |Disable )?Extra ') %}
              {# Kind (Script vs Feature). The keyword sits immediately
                 after the variant + optional 'Extra '. #}
              {% set kind_word = ('script'
                if (lbl | regex_search('^' ~ sf ~ ' (Enable |Disable )?(Extra )?Script( |:)'))
                else 'feature') %}
              {# Tag: optional whitespace-delimited token between the
                 keyword and the colon. Capture by stripping prefix + suffix. #}
              {% set kw = 'Script' if kind_word == 'script' else 'Feature' %}
              {% set tag_pat = '^' ~ sf ~ ' (Enable |Disable )?(Extra )?' ~ kw ~ ' (\\S+): ' %}
              {% set tag_match = lbl | regex_findall(tag_pat) %}
              {% set tag = '' %}
              {% if tag_match | length > 0 %}
                {# regex_findall with capture groups returns tuples;
                   the tag is the last (third) capture. Some HA versions
                   return strings instead — handle both shapes. #}
                {% set first = tag_match[0] %}
                {% if first is string %}{% set tag = first | trim %}
                {% else %}{% set tag = first[-1] | trim %}{% endif %}
              {% endif %}
              {# Ref: everything after the ': '. #}
              {% set ref = lbl | regex_replace('^[^:]+: ', '') | trim %}
              {% set ns.items = ns.items + [{
                'kind': kind_word,
                'replaces_implicit': (not extra),
                'variant': variant,
                'tag': tag,
                'ref': ref
              }] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}
        _arg_pools: >-
          {# Arg pool keyed by (variant, tag).
             Label shape: ^<sf> (Enable |Disable )?Arg( <tag>)? <field>: <value>$
             Substitution syntax on values:
               <attribute>.<dotted.path>
             - must match ^[A-Za-z_][A-Za-z0-9_]*\.
             - first segment is a top-level attribute on
               sensor.labeled_features_state.
             - remaining segments walk into nested dicts.
             - empty segment ('..') is a literal '' key.
             - special case: `leaders.<rest>` with non-eid first path
               segment splices the leader_entity_id in. #}
          {% set _sensor_attrs = states['sensor.labeled_features_state'].attributes
                                 if states['sensor.labeled_features_state'] is not none else {} %}
          {% set sf = scoped_feature %}
          {% set arg_re = '^' ~ sf ~ ' (Enable |Disable )?Arg(?: \\S+)? \\S+: .+$' %}
          {% set sub_re = '^[A-Za-z_][A-Za-z0-9_]*\\.' %}
          {% set ns = namespace(pools={}) %}
          {% for lbl in follower_labels %}
            {% if lbl | regex_search(arg_re) %}
              {% set variant = 'enable' if (lbl | regex_search('^' ~ sf ~ ' Enable Arg'))
                               else ('disable' if (lbl | regex_search('^' ~ sf ~ ' Disable Arg'))
                                     else 'normal') %}
              {% if variant == 'normal' %}
                {% set after_arg = lbl | regex_replace('^' ~ sf ~ ' Arg ', '') %}
              {% else %}
                {% set vw = 'Enable' if variant == 'enable' else 'Disable' %}
                {% set after_arg = lbl | regex_replace('^' ~ sf ~ ' ' ~ vw ~ ' Arg ', '') %}
              {% endif %}
              {% set head = after_arg | regex_replace(':.*$', '') %}
              {% set toks = head.split() %}
              {% if toks | length >= 2 %}
                {% set tag = toks[0] | trim %}
                {% set field_raw = toks[1] | trim %}
              {% else %}
                {% set tag = '' %}
                {% set field_raw = toks[0] | trim %}
              {% endif %}
              {% set raw = lbl | regex_replace('^[^:]+: ', '') | trim %}
              {% if raw | regex_search(sub_re) %}
                {% set parts = raw.split('.') %}
                {% set attr_name = parts[0] %}
                {% set path = parts[1:] %}
                {% set cur_ns = namespace(v=_sensor_attrs.get(attr_name, none)) %}
                {% if attr_name == 'leaders' and path | length > 0
                      and cur_ns.v is not none
                      and (path[0] not in cur_ns.v)
                      and (leader_entity_id | trim) != '' %}
                  {% set cur_ns.v = cur_ns.v.get(leader_entity_id, none) %}
                {% endif %}
                {% for seg in path %}
                  {% if cur_ns.v is mapping %}
                    {% set cur_ns.v = cur_ns.v.get(seg, none) %}
                  {% else %}
                    {% set cur_ns.v = none %}
                  {% endif %}
                {% endfor %}
                {% set resolved = (cur_ns.v if cur_ns.v is not none else raw) | string %}
              {% else %}
                {% set resolved = raw %}
              {% endif %}
              {% set pool_key = variant ~ '||' ~ tag %}
              {% set existing = ns.pools.get(pool_key, {}) %}
              {% set ns.pools = dict(ns.pools, **{pool_key: dict(existing, **{field_raw: resolved})}) %}
            {% endif %}
          {% endfor %}
          {{ ns.pools }}
        _has_replacement: >-
          {{ _label_actions | selectattr('replaces_implicit', 'equalto', true) | list | length > 0 }}
    - variables:
        _action_list: >-
          {%- set implicit = [] -%}
          {%- if not _has_replacement -%}
            {%- set implicit = [{
              'kind': 'feature',
              'replaces_implicit': false,
              'variant': 'normal',
              'tag': '',
              'ref': '',
              'implicit': true
            }] -%}
          {%- endif -%}
          {{ _label_actions + implicit }}

    # ─────────────────────────────────────────────────────────────────────
    # Step 3 — Sort the action list: tag asc (no-tag last), then variant
    # (Enable, Normal, Disable).
    # ─────────────────────────────────────────────────────────────────────
    - variables:
        _variant_rank: >-
          {{ {'enable': 0, 'normal': 1, 'disable': 2} }}
        sorted_actions: >-
          {%- set ns = namespace(annotated=[]) -%}
          {%- for it in _action_list -%}
            {%- set tag = it.tag | default('') -%}
            {%- set tag_bucket = 1 if tag == '' else 0 -%}
            {%- set tag_key = tag if tag != '' else '~~' -%}
            {%- set variant_key = _variant_rank.get(it.variant | default('normal'), 1) -%}
            {%- set ns.annotated = ns.annotated + [
              dict(it, **{
                '_tag_bucket': tag_bucket,
                '_tag_key': tag_key,
                '_variant_key': variant_key
              })
            ] -%}
          {%- endfor -%}
          {{ ns.annotated
             | sort(attribute='_variant_key')
             | sort(attribute='_tag_key')
             | sort(attribute='_tag_bucket') }}

    # ─────────────────────────────────────────────────────────────────────
    # Step 4 — Filter by current state.
    # ─────────────────────────────────────────────────────────────────────
    - variables:
        filtered_actions: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for it in sorted_actions -%}
            {%- set v = it.variant | default('normal') -%}
            {%- if v == 'enable' and not (follower_enabled | bool) -%}
            {%- elif v == 'disable' and (follower_enabled | bool) -%}
            {%- else -%}
              {%- set ns.out = ns.out + [it] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.out }}
        _std_fields_base: >-
          {{ {'follower_entity_id': follower_entity_id,
              'feature': feature,
              'leader_feature': feature,
              'leader_entity_id': leader_entity_id,
              'leader_enabled': leader_enabled,
              'scope': scope,
              'scope_id': scope_id,
              'toggle': follower_toggle,
              'error_mode': follower_error_mode} }}

    # ─────────────────────────────────────────────────────────────────────
    # Step 5 — Execute the loop.
    # ─────────────────────────────────────────────────────────────────────
    - repeat:
        for_each: '{{ filtered_actions }}'
        sequence:
        - variables:
            _it: '{{ repeat.item }}'
            _args: >-
              {{ _arg_pools.get(((_it.variant | default('normal')) ~ '||' ~ (_it.tag | default(''))), {}) }}

        - choose:
          # ───────── script kind ─────────
          - conditions:
              - condition: template
                value_template: '{{ _it.kind == "script" }}'
            sequence:
            # Guard: skip + report when ref is empty / None.
            - if:
              - condition: template
                value_template: '{{ (_it.ref | default("") | string | trim) == "" }}'
              then:
              - action: script.labeled_feature_error_mode
                data:
                  error_mode: '{{ follower_error_mode }}'
                  source: Labeled Feature Follower
                  message: >-
                    Empty script ref in action item (variant={{ _it.variant }},
                    tag={{ _it.tag }}) for {{ follower_entity_id }} (feature: {{ feature_name }}).
              - stop: 'Labeled Feature Follower: empty script ref (handled per error_mode).'
            - if:
              - condition: template
                value_template: '{{ _it.ref.startswith("automation.") or _it.ref.startswith("scene.") }}'
              then:
              - action: '{{ _it.ref }}'
                data: {}
                continue_on_error: true
              else:
              # Pass every arg through to the script. HA does not expose
              # script field declarations as state attributes
              # (`state_attr(<script>, 'fields')` is always None), so we
              # can't validate arg names from inside a template.
              # Undeclared fields are silently ignored by the script
              # invocation; typo'd Arg labels will simply not have an
              # effect (rather than raising an Error Mode warning).
              - variables:
                  _all_args: '{{ _args or {} }}'
              - choose:
                - conditions:
                    - condition: template
                      value_template: '{{ _all_args | length == 0 }}'
                  sequence:
                  - action: '{{ _it.ref }}'
                    data: '{{ _std_fields_base }}'
                    continue_on_error: true
                default:
                - action: script.turn_on
                  target:
                    entity_id: '{{ _it.ref | trim }}'
                  data:
                    variables: '{{ _std_fields_base | combine(_all_args) }}'
                  continue_on_error: true

          # ───────── feature kind ─────────
          - conditions:
              - condition: template
                value_template: '{{ _it.kind == "feature" }}'
            sequence:
            - variables:
                _target_feature: >-
                  {{ _it.ref if (_it.ref | default('') | trim != '') else feature }}
                _is_self: '{{ _target_feature == feature }}'
                _is_implicit: '{{ _it.implicit | default(false) | bool }}'

            - choose:
                # ── Self + non-implicit -> documented no-op
                - conditions:
                    - condition: template
                      value_template: '{{ _is_self and not _is_implicit }}'
                  sequence: []

                # ── Cross-feature -> labeled_feature_generics
                - conditions:
                    - condition: template
                      value_template: '{{ not _is_self }}'
                  sequence:
                  - action: script.labeled_feature_generics
                    data:
                      feature: '{{ _target_feature }}'
                      exclude_feature: '{{ feature }}'
                      scope: '{{ scope }}'
                      scope_id: '{{ scope_id }}'
                      follower_entity_id: '{{ follower_entity_id }}'
                      leader_entity_id: '{{ leader_entity_id }}'
                      leader_enabled: '{{ follower_enabled }}'
                      toggle: '{{ follower_toggle }}'
                      error_mode: '{{ follower_error_mode }}'
                    continue_on_error: true

              # ── default: self + implicit -> direct entity action ──
              default:
              - variables:
                  follower_target_value: >-
                    {% set pfx = scoped_feature + (' Enable: ' if follower_enabled else ' Disable: ') %}
                    {% set match = follower_labels | select('match', '^' + pfx + '.+') | first | default('') %}
                    {% if match == '' %}
                      {% set pfx2 = scoped_feature + ': ' %}
                      {% set match = follower_labels | select('match', '^' + pfx2 + '.+') | first | default('') %}
                    {% endif %}
                    {{ match | regex_replace('^.+: ', '') | trim }}

              # ── Direct-value path (skipped in toggle mode)
              - if:
                - condition: template
                  value_template: '{{ follower_target_value != "" and not follower_toggle }}'
                then:
                - condition: template
                  value_template: '{{ states(follower_entity_id) != follower_target_value }}'
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "select" }}'
                  then:
                  - action: select.select_option
                    target:
                      entity_id: '{{ follower_entity_id }}'
                    data:
                      option: '{{ follower_target_value }}'
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "input_select" }}'
                  then:
                  - action: input_select.select_option
                    target:
                      entity_id: '{{ follower_entity_id }}'
                    data:
                      option: '{{ follower_target_value }}'
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "number" }}'
                  then:
                  - action: number.set_value
                    target:
                      entity_id: '{{ follower_entity_id }}'
                    data:
                      value: '{{ follower_target_value }}'
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "input_number" }}'
                  then:
                  - action: input_number.set_value
                    target:
                      entity_id: '{{ follower_entity_id }}'
                    data:
                      value: '{{ follower_target_value }}'
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "text" }}'
                  then:
                  - action: text.set_value
                    target:
                      entity_id: '{{ follower_entity_id }}'
                    data:
                      value: '{{ follower_target_value }}'
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "input_text" }}'
                  then:
                  - action: input_text.set_value
                    target:
                      entity_id: '{{ follower_entity_id }}'
                    data:
                      value: '{{ follower_target_value }}'
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "light" }}'
                  then:
                  - if:
                    - condition: template
                      value_template: '{{ follower_target_value | int(-1) >= 0 }}'
                    then:
                    - action: light.turn_on
                      target:
                        entity_id: '{{ follower_entity_id }}'
                      data:
                        brightness_pct: '{{ [follower_target_value | int(0), 100] | min }}'

              # ── Toggle path
              - if:
                - condition: template
                  value_template: '{{ follower_toggle }}'
                then:
                - variables:
                    _toggle_current_on: >-
                      {{ states(follower_entity_id) | lower in
                         ['on', 'true', 'home', 'open', 'detected', 'active', 'unlocked'] }}
                    _toggle_supported_domains: >-
                      {{ ['light', 'switch', 'input_boolean', 'fan', 'cover',
                          'media_player', 'climate', 'humidifier', 'siren', 'remote',
                          'automation', 'script', 'lock'] }}
                    _toggle_unsupported_domains: >-
                      {{ ['select', 'input_select', 'number', 'input_number', 'text',
                          'input_text', 'scene', 'button', 'event', 'sensor',
                          'binary_sensor', 'vacuum'] }}
                - if:
                  - condition: template
                    value_template: '{{ follower_domain in _toggle_unsupported_domains }}'
                  then:
                  - action: script.labeled_feature_error_mode
                    data:
                      error_mode: '{{ follower_error_mode }}'
                      source: Labeled Feature Follower
                      message: >-
                        Toggle not supported for domain {{ follower_domain }} on
                        {{ follower_entity_id }} (feature: {{ feature_name }}).
                  - if:
                    - condition: template
                      value_template: '{{ follower_error_mode == "stop" }}'
                    then:
                    - stop: 'Labeled Feature Follower: toggle unsupported for {{ follower_domain }}.'
                      error: true
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "lock" }}'
                  then:
                  - action: '{{ "lock.unlock" if _toggle_current_on else "lock.lock" }}'
                    target:
                      entity_id: '{{ follower_entity_id }}'
                - if:
                  - condition: template
                    value_template: '{{ follower_domain == "media_player" and follower_domain not in _toggle_unsupported_domains }}'
                  then:
                  - variables:
                      _mp_supported: '{{ state_attr(follower_entity_id, "supported_features") | int(0) }}'
                      _mp_supports_on_off: '{{ _mp_supported | bitwise_and(128) > 0 }}'
                      _mp_supports_mute: '{{ _mp_supported | bitwise_and(4) > 0 }}'
                  - if:
                    - condition: template
                      value_template: '{{ _mp_supports_on_off }}'
                    then:
                    - action: media_player.toggle
                      target:
                        entity_id: '{{ follower_entity_id }}'
                    else:
                    - if:
                      - condition: template
                        value_template: '{{ _mp_supports_mute }}'
                      then:
                      - action: media_player.volume_mute
                        target:
                          entity_id: '{{ follower_entity_id }}'
                        data:
                          is_volume_muted: '{{ not (state_attr(follower_entity_id, "is_volume_muted") | bool(false)) }}'
                      else:
                      - action: script.labeled_feature_error_mode
                        data:
                          error_mode: '{{ follower_error_mode }}'
                          source: Labeled Feature Follower
                          message: 'media_player {{ follower_entity_id }} supports neither on/off nor mute toggle (feature: {{ feature_name }}).'
                      - if:
                        - condition: template
                          value_template: '{{ follower_error_mode == "stop" }}'
                        then:
                        - stop: 'Labeled Feature Follower: media_player {{ follower_entity_id }} has neither toggle nor mute.'
                          error: true
                - if:
                  - condition: template
                    value_template: '{{ follower_domain in _toggle_supported_domains and follower_domain not in ["lock", "media_player"] }}'
                  then:
                  - action: homeassistant.toggle
                    target:
                      entity_id: '{{ follower_entity_id }}'

              # ── Domain-default on/off path (no Enable/Disable value, no toggle)
              - if:
                - condition: template
                  value_template: '{{ follower_target_value == "" and not follower_toggle and follower_domain == "light" }}'
                then:
                - condition: template
                  value_template: '{{ states(follower_entity_id) | lower not in (["on"] if follower_enabled else ["off"]) }}'
                - action: 'light.turn_{{ "on" if follower_enabled else "off" }}'
                  target:
                    entity_id: '{{ follower_entity_id }}'
              - if:
                - condition: template
                  value_template: '{{ follower_target_value == "" and not follower_toggle and follower_domain in ["switch", "input_boolean"] }}'
                then:
                - condition: template
                  value_template: '{{ states(follower_entity_id) | lower not in (["on"] if follower_enabled else ["off"]) }}'
                - action: '{{ follower_domain }}.turn_{{ "on" if follower_enabled else "off" }}'
                  target:
                    entity_id: '{{ follower_entity_id }}'
              # ── button.* / scene.* — momentary trigger domains.
              # These entities are stateless triggers, not stateful on/off
              # targets. `homeassistant.turn_on/off` against `button.*`
              # silently does nothing (the catch-all domain branch below
              # would otherwise hit this case and no-op).
              #
              # Semantics:
              #   - follower_enabled == true  → press / activate (button.press / scene.turn_on)
              #   - follower_enabled == false → no-op (you can't "un-press" a button)
              #
              # Toggle mode is handled higher up in the Toggle path —
              # buttons land in `_toggle_unsupported_domains` and route
              # through Error Mode. (If a user explicitly wants Toggle
              # semantics on a momentary entity they should remove it
              # from the unsupported list, but the default is to refuse.)
              - if:
                - condition: template
                  value_template: '{{ follower_target_value == "" and not follower_toggle and follower_domain == "button" and follower_enabled }}'
                then:
                - action: button.press
                  target:
                    entity_id: '{{ follower_entity_id }}'
              - if:
                - condition: template
                  value_template: '{{ follower_target_value == "" and not follower_toggle and follower_domain == "scene" and follower_enabled }}'
                then:
                - action: scene.turn_on
                  target:
                    entity_id: '{{ follower_entity_id }}'

              - if:
                - condition: template
                  value_template: '{{ follower_target_value == "" and not follower_toggle and follower_domain == "media_player" }}'
                then:
                - variables:
                    mp_supported: '{{ state_attr(follower_entity_id, "supported_features") | int(0) }}'
                    mp_supports_on_off: '{{ mp_supported | bitwise_and(128) > 0 }}'
                    mp_supports_mute: '{{ mp_supported | bitwise_and(4) > 0 }}'
                - if:
                  - condition: template
                    value_template: '{{ mp_supports_on_off }}'
                  then:
                  - condition: template
                    value_template: >-
                      {{ states(follower_entity_id) | lower not in
                         (['on', 'playing', 'idle', 'paused', 'buffering']
                          if follower_enabled else
                          ['off', 'unavailable', 'standby']) }}
                  - action: 'media_player.turn_{{ "on" if follower_enabled else "off" }}'
                    target:
                      entity_id: '{{ follower_entity_id }}'
                  else:
                  - if:
                    - condition: template
                      value_template: '{{ mp_supports_mute }}'
                    then:
                    - condition: template
                      value_template: '{{ state_attr(follower_entity_id, "is_volume_muted") != (not follower_enabled) }}'
                    - action: media_player.volume_mute
                      target:
                        entity_id: '{{ follower_entity_id }}'
                      data:
                        is_volume_muted: '{{ not follower_enabled }}'
              - if:
                - condition: template
                  value_template: >-
                    {{ follower_target_value == '' and not follower_toggle and follower_domain not in
                       ['light', 'switch', 'input_boolean', 'media_player',
                        'number', 'input_number', 'text', 'input_text',
                        'select', 'input_select'] }}
                then:
                - condition: template
                  value_template: >-
                    {{ states(follower_entity_id) | lower not in
                       (['on', 'true', 'home', 'open', 'detected', 'active', 'unlocked']
                        if follower_enabled else
                        ['off', 'false', 'away', 'closed', 'clear', 'inactive', 'locked']) }}
                - action: 'homeassistant.turn_{{ "on" if follower_enabled else "off" }}'
                  target:
                    entity_id: '{{ follower_entity_id }}'

        # ── Per-iteration error routing ──
        - if:
          - condition: template
            value_template: '{{ error is defined }}'
          then:
          - if:
            - condition: template
              value_template: '{{ follower_error_mode == "log" }}'
            then:
            - action: system_log.write
              data:
                level: error
                message: >-
                  Labeled Feature Follower: action error (kind={{ _it.kind }},
                  ref={{ _it.ref }}, tag={{ _it.tag }}, variant={{ _it.variant }})
                  for {{ follower_entity_id }} (feature: {{ feature_name }}): {{ error }}
          - if:
            - condition: template
              value_template: '{{ follower_error_mode == "alert" }}'
            then:
            - action: script.send_alert
              data:
                alert_severity: high
                alert_title: Labeled Feature Follower Error
                alert_message: >-
                  Action error (kind={{ _it.kind }}, ref={{ _it.ref }},
                  tag={{ _it.tag }}) for {{ follower_entity_id }}
                  (feature: {{ feature_name }}): {{ error }}
          - if:
            - condition: template
              value_template: '{{ follower_error_mode == "stop" }}'
            then:
            - stop: 'Labeled Feature Follower: halted on {{ _it.ref }} (feature: {{ feature_name }})'
              error: true
