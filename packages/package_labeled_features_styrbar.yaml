# https://github.com/tonylofgren/aurora-smart-home

######################################################################################################################
## Package - Label Based Features - Styrbar button mapping
##
##   * script.labeled_feature_styrbar - translates STYRBAR controller
##     events into generic-feature calls.
##
## Depends on: package_labeled_features_generics.yaml (which transitively
##   pulls state / dispatch / error_mode).
## Driven by: the dispatch layer (package_labeled_features_dispatch.yaml)
##   via the button leaders' Script labels.
######################################################################################################################

script:
  labeled_feature_styrbar:
    alias: Labeled Feature Styrbar
    description: >
      Maps IKEA STYRBAR (4-button + dimmer wheel) raw event names into calls to
      `script.labeled_feature_generics`. Reads the raw button event from the
      `feature` field (e.g. 'on', 'brightness_move_up', 'arrow_right_click').

      `*_release` and `brightness_stop` events are ignored (no `choose:`
      branch); the hold loop inside `labeled_feature_generics` already exits
      on the leader's state change, so the explicit "release" event is not
      needed.

      Event → generic-feature mapping (scopes mixed — area default; Night
      global; Bright floor):
        on                    Lights On            (one-shot)
        off                   Lights Off           (one-shot)
        brightness_move_up    Lights Up            (hold loop via leader_entity_id)
        brightness_move_down  Lights Down          (hold loop)
        brightness_stop       ignored
        arrow_left_click      Night                (toggle:true, scope: none — house-wide)
        arrow_left_hold       Lights Off           (one-shot, area)
        arrow_left_release    ignored
        arrow_right_click     Eating               (area, label-only user feature)
        arrow_right_hold      Bright               (floor, label-only user feature)
        arrow_right_release   ignored

      `Eating` and `Bright` are user-defined label-only features: they have no
      `feature_meta` entry and resolve entirely via `(Area |Floor |)Follower:
      Eating` / `(Area |Floor |)Follower: Bright` labels on target entities.
      The script still does not compute `media_playing` (no media-dependent
      branches), but the prologue resolves the leader's area and floor ids so
      the floor-scoped `Bright` branch has a scope_id to dispatch with.
    mode: parallel
    max: 50
    fields:
      feature:
        name: Feature (Button Event)
        description: >
          The raw button event string from the STYRBAR button entity, e.g.
          'on', 'off', 'brightness_move_up', 'arrow_left_click'.
        required: true
        selector:
          select:
            custom_value: true
            options:
              - 'on'
              - 'off'
              - brightness_move_up
              - brightness_move_down
              - arrow_left_click
              - arrow_left_hold
              - arrow_right_click
              - arrow_right_hold
      follower_entity_id:
        name: Follower Entity ID
        description: Used for area lookup. Passed automatically by labeled_feature_follower.
        required: false
        default: ''
        selector:
          entity:
      leader_entity_id:
        name: Leader Entity ID (the button)
        description: >
          Used as fallback for area lookup, and — critically — forwarded to
          `labeled_feature_generics` for the stepping features (Lights Up /
          Lights Down) so the hold-while-held loop runs until the button's
          state changes.
        required: false
        default: ''
        selector:
          entity:
      leader_enabled:
        name: Leader Enabled
        description: Pass-through from the leader. Not used directly by the styrbar mapping.
        required: false
        default: true
        selector:
          boolean:
      leader_feature:
        name: Leader Feature Name
        description: >
          The leader's labeled feature name (e.g. 'Bedroom Buttons'), passed by
          the leader automation alongside `feature`. Forwarded as
          `exclude_feature` on every downstream `labeled_feature_generics` call
          so that `(Area |Floor |)<leader_feature> Exclude: True` opts entities
          out of every action this script dispatches.
        required: false
        default: ''
        selector:
          text:
      toggle:
        name: Toggle
        description: >
          Pass-through toggle flag from the leader. Forwarded to every
          labeled_feature_generics call.
        required: false
        default: false
        selector:
          boolean:
      scope:
        name: Scope
        description: Scope of the feature (area, floor, or none).
        required: false
        default: area
        selector:
          select:
            options:
              - area
              - floor
              - none
      scope_id:
        name: Scope ID
        description: The resolved area_id or floor_id passed by the automation.
        required: false
        default: ''
        selector:
          text:
      error_mode:
        name: Error Mode
        description: silent | log | alert | stop. Default 'log'.
        required: false
        default: log
        selector:
          select:
            custom_value: true
            options:
              - silent
              - log
              - alert
              - stop
    sequence:
      # ── Step 1: Resolve normalized inputs and scope ids ─────────────────────
      - variables:
          _scope: '{{ (scope | default("area") | lower) }}'
          _toggle_in: '{{ (toggle | default(false)) | bool(false) }}'
          _err_mode: '{{ (error_mode | default("log") | lower) }}'
          _leader_feature: '{{ leader_feature | default("") | trim }}'
          _event: '{{ (feature | default("") | trim) }}'
          _resolved_area_id: >-
            {%- if _scope == 'area' and scope_id is defined and scope_id != '' -%}
              {{ scope_id }}
            {%- elif follower_entity_id is defined and follower_entity_id != '' -%}
              {{ area_id(follower_entity_id) | default('') }}
            {%- elif leader_entity_id is defined and leader_entity_id != '' -%}
              {{ area_id(leader_entity_id) | default('') }}
            {%- else -%}{{ '' }}{%- endif -%}
          _resolved_floor_id: >-
            {%- if _scope == 'floor' and scope_id is defined and scope_id != '' -%}
              {{ scope_id }}
            {%- elif _scope == 'floor' and follower_entity_id is defined and follower_entity_id != '' -%}
              {%- set aid = area_id(follower_entity_id) -%}
              {%- set ns = namespace(found='') -%}
              {%- for fid in floors() -%}
                {%- if aid in floor_areas(fid) -%}{%- set ns.found = fid -%}{%- endif -%}
              {%- endfor -%}{{ ns.found }}
            {%- elif _scope == 'floor' and leader_entity_id is defined and leader_entity_id != '' -%}
              {%- set aid = area_id(leader_entity_id) -%}
              {%- set ns = namespace(found='') -%}
              {%- for fid in floors() -%}
                {%- if aid in floor_areas(fid) -%}{%- set ns.found = fid -%}{%- endif -%}
              {%- endfor -%}{{ ns.found }}
            {%- else -%}
              {# Derive the floor id even for non-floor scopes so the
                 arrow_right_hold Floor Bright branch has a scope_id. #}
              {%- set aid = _resolved_area_id -%}
              {%- if aid == '' and follower_entity_id is defined and follower_entity_id != '' -%}
                {%- set aid = area_id(follower_entity_id) | default('') -%}
              {%- endif -%}
              {%- if aid == '' and leader_entity_id is defined and leader_entity_id != '' -%}
                {%- set aid = area_id(leader_entity_id) | default('') -%}
              {%- endif -%}
              {%- set ns = namespace(found='') -%}
              {%- if aid != '' -%}
                {%- for fid in floors() -%}
                  {%- if aid in floor_areas(fid) -%}{%- set ns.found = fid -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.found }}
            {%- endif -%}

      # ── Step 2: Branch by event ─────────────────────────────────────────────
      # Scopes are mixed: the light branches use the caller's scope (area by
      # default), arrow_left_click forces global Night, and arrow_right_hold
      # forces floor-scoped Bright. The brightness_move_* branches forward
      # `leader_entity_id` so generics' built-in hold loop runs.
      - choose:
          # ────────────── on ──────────────
          - conditions:
              - condition: template
                value_template: '{{ _event == "on" }}'
            sequence:
              - action: script.labeled_feature_generics
                data:
                  feature: Lights On
                  exclude_feature: '{{ _leader_feature }}'
                  scope: '{{ _scope }}'
                  scope_id: '{{ scope_id | default("") }}'
                  follower_entity_id: '{{ follower_entity_id | default("") }}'
                  leader_entity_id: '{{ leader_entity_id | default("") }}'
                  leader_enabled: '{{ leader_enabled | default(true) }}'
                  toggle: '{{ _toggle_in }}'
                  error_mode: '{{ _err_mode }}'

          # ────────────── off ──────────────
          - conditions:
              - condition: template
                value_template: '{{ _event == "off" }}'
            sequence:
              - action: script.labeled_feature_generics
                data:
                  feature: Lights Off
                  exclude_feature: '{{ _leader_feature }}'
                  scope: '{{ _scope }}'
                  scope_id: '{{ scope_id | default("") }}'
                  follower_entity_id: '{{ follower_entity_id | default("") }}'
                  leader_entity_id: '{{ leader_entity_id | default("") }}'
                  leader_enabled: '{{ leader_enabled | default(true) }}'
                  toggle: '{{ _toggle_in }}'
                  error_mode: '{{ _err_mode }}'

          # ────────────── brightness_move_up ──────────────
          # Stepping feature: forwarding leader_entity_id opts into the
          # generics hold loop.
          - conditions:
              - condition: template
                value_template: '{{ _event == "brightness_move_up" }}'
            sequence:
              - action: script.labeled_feature_generics
                data:
                  feature: Lights Up
                  exclude_feature: '{{ _leader_feature }}'
                  scope: '{{ _scope }}'
                  scope_id: '{{ scope_id | default("") }}'
                  follower_entity_id: '{{ follower_entity_id | default("") }}'
                  leader_entity_id: '{{ leader_entity_id | default("") }}'
                  leader_enabled: '{{ leader_enabled | default(true) }}'
                  toggle: '{{ _toggle_in }}'
                  error_mode: '{{ _err_mode }}'

          # ────────────── brightness_move_down ──────────────
          - conditions:
              - condition: template
                value_template: '{{ _event == "brightness_move_down" }}'
            sequence:
              - action: script.labeled_feature_generics
                data:
                  feature: Lights Down
                  exclude_feature: '{{ _leader_feature }}'
                  scope: '{{ _scope }}'
                  scope_id: '{{ scope_id | default("") }}'
                  follower_entity_id: '{{ follower_entity_id | default("") }}'
                  leader_entity_id: '{{ leader_entity_id | default("") }}'
                  leader_enabled: '{{ leader_enabled | default(true) }}'
                  toggle: '{{ _toggle_in }}'
                  error_mode: '{{ _err_mode }}'

          # ────────────── arrow_left_click ──────────────
          # Toggle house-wide night mode: generic Night at global scope,
          # forced toggle:true (mirrors symfonisk dots_2_double_press).
          - conditions:
              - condition: template
                value_template: '{{ _event == "arrow_left_click" }}'
            sequence:
              - action: script.labeled_feature_generics
                data:
                  feature: Night
                  exclude_feature: '{{ _leader_feature }}'
                  scope: none
                  scope_id: ''
                  follower_entity_id: '{{ follower_entity_id | default("") }}'
                  leader_entity_id: '{{ leader_entity_id | default("") }}'
                  leader_enabled: '{{ leader_enabled | default(true) }}'
                  toggle: true
                  error_mode: '{{ _err_mode }}'

          # ────────────── arrow_left_hold ──────────────
          # Area Lights Off, one-shot.
          - conditions:
              - condition: template
                value_template: '{{ _event == "arrow_left_hold" }}'
            sequence:
              - action: script.labeled_feature_generics
                data:
                  feature: Lights Off
                  exclude_feature: '{{ _leader_feature }}'
                  scope: '{{ _scope }}'
                  scope_id: '{{ scope_id | default("") }}'
                  follower_entity_id: '{{ follower_entity_id | default("") }}'
                  leader_entity_id: '{{ leader_entity_id | default("") }}'
                  leader_enabled: '{{ leader_enabled | default(true) }}'
                  toggle: '{{ _toggle_in }}'
                  error_mode: '{{ _err_mode }}'

          # ────────────── arrow_right_click ──────────────
          # User-defined label-only feature Eating (area scope) — resolves
          # via (Area )Follower: Eating labels; enable semantics (toggle
          # pass-through).
          - conditions:
              - condition: template
                value_template: '{{ _event == "arrow_right_click" }}'
            sequence:
              - action: script.labeled_feature_generics
                data:
                  feature: Eating
                  exclude_feature: '{{ _leader_feature }}'
                  scope: '{{ _scope }}'
                  scope_id: '{{ scope_id | default("") }}'
                  follower_entity_id: '{{ follower_entity_id | default("") }}'
                  leader_entity_id: '{{ leader_entity_id | default("") }}'
                  leader_enabled: '{{ leader_enabled | default(true) }}'
                  toggle: '{{ _toggle_in }}'
                  error_mode: '{{ _err_mode }}'

          # ────────────── arrow_right_hold ──────────────
          # User-defined label-only feature Bright — floor-scoped, the same
          # floor-wide Bright symfonisk dots_1_long_press dispatches.
          - conditions:
              - condition: template
                value_template: '{{ _event == "arrow_right_hold" }}'
            sequence:
              - action: script.labeled_feature_generics
                data:
                  feature: Bright
                  exclude_feature: '{{ _leader_feature }}'
                  scope: floor
                  scope_id: '{{ _resolved_floor_id }}'
                  follower_entity_id: '{{ follower_entity_id | default("") }}'
                  leader_entity_id: '{{ leader_entity_id | default("") }}'
                  leader_enabled: '{{ leader_enabled | default(true) }}'
                  toggle: '{{ _toggle_in }}'
                  error_mode: '{{ _err_mode }}'

          # All other events (brightness_stop, *_release, *_initial_press)
          # have no `choose:` branch and fall through silently — no Error
          # Mode is raised because they are expected "noise" events that
          # the script intentionally does not act on.
