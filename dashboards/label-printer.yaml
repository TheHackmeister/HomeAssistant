views:
  - title: Label Printer
    path: label-printer
    type: masonry
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: >-
              ## Label Printer

              Fill in the fields below, preview your label, then send to printer.

          - type: entities
            title: Label Fields
            show_state: false
            entities:
              - entity: input_select.label_template
              - entity: input_select.label_tape_mm
              - entity: input_text.label_name
              - entity: input_text.label_date
              - entity: input_select.label_date_preset
              - entity: input_select.label_icon
              - entity: input_text.label_preview_path
              - entity: input_text.label_extra_fields

      - type: vertical-stack
        cards:
          - type: markdown
            content: "**Preview**"
          - type: picture
            image: /local/labels/preview.png
            tap_action:
              action: none
          - type: horizontal-stack
            cards:
              - type: button
                name: Preview
                icon: mdi:image-search
                show_state: false
                tap_action:
                  action: call-service
                  service: script.label_dashboard_action
                  data:
                    send: false
              - type: button
                name: Print
                icon: mdi:printer
                show_state: false
                tap_action:
                  action: call-service
                  service: script.label_dashboard_action
                  data:
                    send: true
              - type: button
                name: Reset
                icon: mdi:restore
                show_state: false
                tap_action:
                  action: call-service
                  service: script.label_dashboard_reset