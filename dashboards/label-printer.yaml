views:
  - type: sections
    max_columns: 2
    title: Label Printer
    path: label-printer
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              ## Label Printer

              **Step 1:** Preview a label — pick a template, fill in the
              fields, and dry-run. The preview on the right updates.

              **Step 2:** Once the preview looks right, print the same label.
          - type: button
            name: Preview Label
            icon: mdi:image-search
            tap_action:
              action: perform-action
              perform_action: script.preview_label
          - type: button
            name: Print Label
            icon: mdi:printer
            tap_action:
              action: perform-action
              perform_action: script.print_label_send
      - type: grid
        cards:
          - type: picture
            image: /local/labels/preview.png
            title: Preview
