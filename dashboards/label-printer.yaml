# Generated by aurora@aurora-smart-home (home-assistant skill)
# https://github.com/tonylofgren/aurora-smart-home
#
# Label Printer dashboard.
# Flow: fill in the label_* helpers -> Preview Label -> check the preview ->
# Send to Printer. Reset restores the helper defaults (script.label_reset).
# The Preview/Print buttons pass the helper values into script.print_label
# (Label: Print); the preview PNG lands in www/labels/<environment>/ and the
# cache-busted URL is published to input_text.label_preview_url.
views:
  - title: Label Printer
    path: label-printer
    icon: mdi:label-printer
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: entities
            title: Label Options
            icon: mdi:format-list-text
            show_header_toggle: false
            entities:
              - entity: sensor.brother_label_printer
                name: Printer
              - type: divider
              - input_select.label_template
              - input_select.label_tape_mm
              - input_text.label_name
              - input_text.label_date
              - input_select.label_date_preset
              - input_select.label_icon
              - input_text.label_extra_fields
              - type: divider
              - entity: input_text.label_environment
                name: Environment (preview subfolder)
          - type: vertical-stack
            cards:
              - type: button
                name: Preview Label
                icon: mdi:image-search
                tap_action:
                  action: perform-action
                  perform_action: script.print_label
                  data:
                    label_template: "{{ states('input_select.label_template') }}"
                    tape_mm: "{{ states('input_select.label_tape_mm') }}"
                    send: false
                    name: "{{ states('input_text.label_name') }}"
                    date: "{{ states('input_text.label_date') }}"
                    date_preset: "{{ states('input_select.label_date_preset') }}"
                    icon: "{{ states('input_select.label_icon') }}"
                    extra_fields: "{{ states('input_text.label_extra_fields') }}"
              - type: button
                name: Send to Printer
                icon: mdi:printer
                confirmation:
                  text: Print this label?
                tap_action:
                  action: perform-action
                  perform_action: script.print_label
                  data:
                    label_template: "{{ states('input_select.label_template') }}"
                    tape_mm: "{{ states('input_select.label_tape_mm') }}"
                    send: true
                    name: "{{ states('input_text.label_name') }}"
                    date: "{{ states('input_text.label_date') }}"
                    date_preset: "{{ states('input_select.label_date_preset') }}"
                    icon: "{{ states('input_select.label_icon') }}"
                    extra_fields: "{{ states('input_text.label_extra_fields') }}"
              - type: button
                name: Reset Label Fields
                icon: mdi:refresh
                tap_action:
                  action: perform-action
                  perform_action: script.label_reset
      - type: grid
        cards:
          - type: markdown
            title: Preview
            content: >-
              {% set url = states('input_text.label_preview_url') %}

              {% if url and url not in ('unknown', 'unavailable') %}
                ![Label preview]({{ url }})
              {% else %}
                *No preview yet — fill in the options on the left and press
                **Preview Label**.*
              {% endif %}
