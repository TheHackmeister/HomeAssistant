- type: sections
  max_columns: 1
  title: Saved Groups
  path: label-groups
  icon: mdi:content-save
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Saved Groups
      icon: mdi:content-save
    - type: entities
      entities:
      - entity: input_text.label_group_search
        name: Search (name, keywords, template)
    - type: custom:auto-entities
      card:
        type: custom:label-group-list
      card_param: entities
      filter:
        template: "{% set q = states('input_text.label_group_search') | lower | trim %}\n{% for e in states.label_group %}\n  {% set a = e.attributes %}\n  {% set hay = (e.state ~ ' ' ~ a.get('search',\
          \ '') ~ ' ' ~ a.get('template', '')) | lower %}\n  {% if not q or q in hay %}{{ e.entity_id }},{% endif %}\n{% endfor %}\n"
      sort:
        method: name
