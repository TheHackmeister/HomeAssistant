views:
  - title: Label Printer
    path: label-printer
    cards:
      - type: markdown
        content: >-
          ## Label Printer

          Fill in the fields below, preview the label, then send to printer.

      - type: entities
        title: Label Options
        show_header_toggle: false
        entities:
          - type: input-select
            entity: input_select.label_template
            name: Template
          - type: input-select
            entity: input_select.label_tape_mm
            name: Tape Width
          - type: input-text
            entity: input_text.label_name
            name: Name
          - type: input-text
            entity: input_text.label_date
            name: Date
          - type: input-select
            entity: input_select.label_date_preset
            name: Date Preset
          - type: input-select
            entity: input_select.label_icon
            name: Icon
          - type: input-text
            entity: input_text.label_extra_fields
            name: Extra Fields

      - type: markdown
        content: >-
          {% set ts = states('input_text.label_preview_ts') | default('0') %}
          <div style="text-align:center;">
            <img src="/local/labels/preview.png?t={{ ts }}" style="max-width:100%; height:auto; border-radius:8px;" alt="Label Preview" />
          </div>

      - type: grid
        square: false
        columns: 3
        cards:
          - type: button
            tap_action:
              action: perform-action
              perform_action: script.label_print_from_helpers
              data:
                send: false
            icon: mdi:image-search
            name: Preview
          - type: button
            tap_action:
              action: perform-action
              perform_action: script.label_print_from_helpers
              data:
                send: true
            icon: mdi:printer
            name: Print
          - type: button
            tap_action:
              action: perform-action
              perform_action: script.label_reset
            icon: mdi:restart
            name: Reset
