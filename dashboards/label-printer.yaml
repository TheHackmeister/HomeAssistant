views:
- type: sections
  max_columns: 2
  title: Label Printer
  path: label-printer
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Label Printer
      icon: mdi:label-printer
    - type: markdown
      content: '**Step 1:** Pick a template — the form below shows that template''s fields (`*` = required). Empty required fields are filled with their own name on preview, so you can see exactly where
        each field lands on the label.


        **Step 2:** Click **Preview Label** — the dry-run render appears on the right, and the tape width syncs to what''s physically loaded.


        **Step 3:** When the preview looks right, click **Send to Printer** (printing requires all `*` fields to be filled). **Reset** restores every field to its default.'
    - type: entities
      title: Label options
      entities:
      - entity: input_select.label_template
        name: Template
    - type: custom:config-template-card
      entities:
      - input_select.label_template
      card:
        type: entities
        title: Label fields
        entities: "${ (() => {\n                  const S = {\"kitchen/pantry_jar\":{\"f\":[[\"name\",1],[\"purchased\",1],[\"expires\",0]],\"i\":1},\"kitchen/spice\":{\"f\":[[\"name\",1],[\"origin\",0],[\"\
          best_by\",0]],\"i\":0},\"kitchen/leftover\":{\"f\":[[\"contents\",1],[\"cooked\",1],[\"eat_within_days\",0]],\"i\":0},\"kitchen/freezer\":{\"f\":[[\"contents\",1],[\"frozen\",1],[\"portion\",0]],\"\
          i\":0},\"electronics/component_bin\":{\"f\":[[\"value\",1],[\"footprint\",1],[\"tolerance\",0]],\"i\":0},\"electronics/cable_flag\":{\"f\":[[\"title\",0],[\"source\",0],[\"dest\",0],[\"date\"\
          ,0],[\"details\",0],[\"link\",0],[\"image\",0],[\"wire\",0],[\"overlap_mm\",0]],\"i\":0},\"electronics/psu_polarity\":{\"f\":[[\"voltage\",1],[\"current\",1],[\"polarity\",0]],\"i\":0},\"three_d_printing/filament_spool\"\
          :{\"f\":[[\"material\",1],[\"color\",1],[\"brand\",1],[\"opened\",1],[\"nozzle_temp\",0],[\"bed_temp\",0]],\"i\":0},\"three_d_printing/print_bin\":{\"f\":[[\"part\",1],[\"project\",0],[\"qty\"\
          ,0]],\"i\":0},\"three_d_printing/tool_tag\":{\"f\":[[\"tool\",1],[\"owner\",0]],\"i\":0},\"utility/qr\":{\"f\":[[\"data\",1],[\"caption\",0]],\"i\":0},\"utility/image\":{\"f\":[[\"path\",1],[\"\
          caption\",0],[\"threshold\",0]],\"i\":0},\"garden/seed_packet\":{\"f\":[[\"variety\",1],[\"sow_by\",1],[\"year\",0]],\"i\":1},\"garden/plant_tag\":{\"f\":[[\"name\",1],[\"planted\",1]],\"i\":1},\"\
          garden/row_marker\":{\"f\":[[\"crop\",1],[\"variety\",1]],\"i\":1},\"networking/patch_port\":{\"f\":[[\"port\",1],[\"vlan\",1],[\"dest\",0]],\"i\":1},\"networking/rack_unit\":{\"f\":[[\"unit\"\
          ,1],[\"device\",1]],\"i\":1},\"networking/wap_location\":{\"f\":[[\"name\",1],[\"location\",1]],\"i\":1},\"workshop/hazard\":{\"f\":[[\"hazard\",1],[\"text\",1],[\"code\",0]],\"i\":1},\"workshop/tool_id\"\
          :{\"f\":[[\"name\",1],[\"owner\",1],[\"project\",0]],\"i\":1},\"workshop/torque_cal\":{\"f\":[[\"tool\",1],[\"range_nm\",1],[\"last_cal\",1]],\"i\":1},\"workshop/first_aid\":{\"f\":[[\"kit\",1],[\"\
          expires\",1]],\"i\":1},\"home_inventory/moving_box\":{\"f\":[[\"room\",1],[\"contents\",1],[\"fragile\",0]],\"i\":1},\"home_inventory/warranty\":{\"f\":[[\"item\",1],[\"expires\",1],[\"receipt\"\
          ,0]],\"i\":1},\"home_inventory/storage_bin\":{\"f\":[[\"location\",1],[\"contents\",1]],\"i\":1},\"media/bookshelf_tag\":{\"f\":[[\"title\",1],[\"author\",1],[\"callno\",0]],\"i\":1},\"media/archive_box\"\
          :{\"f\":[[\"label\",1],[\"retain_until\",1]],\"i\":1},\"media/cd_record\":{\"f\":[[\"title\",1],[\"artist\",1],[\"year\",0]],\"i\":1},\"pet/collar_backup\":{\"f\":[[\"name\",1],[\"contact\",1]],\"\
          i\":1},\"pet/med_schedule\":{\"f\":[[\"pet\",1],[\"med\",1],[\"cadence\",1]],\"i\":1},\"pet/food_bowl\":{\"f\":[[\"pet\",1],[\"food\",1],[\"portion\",1]],\"i\":1},\"travel/luggage_tag\":{\"f\"\
          :[[\"name\",1],[\"contact\",1]],\"i\":1},\"travel/gear_bag\":{\"f\":[[\"bag\",1],[\"purpose\",1]],\"i\":1},\"travel/power_bank\":{\"f\":[[\"capacity_mah\",1],[\"charged\",1],[\"model\",0]],\"\
          i\":1},\"calibration/instrument_cal\":{\"f\":[[\"instrument\",1],[\"next_due\",1],[\"owner\",0]],\"i\":1},\"calibration/cert_id\":{\"f\":[[\"cert_no\",1],[\"issuer\",1]],\"i\":1},\"calibration/thermometer_cal\"\
          :{\"f\":[[\"instrument\",1],[\"ice_point_c\",1],[\"checked\",1]],\"i\":1}};\n                  const sch = S[states['input_select.label_template'].state];\n                  if (!sch) return [];\n\
          \                  const rows = sch.f.slice(0, 6).map((f, i) => ({\n                    entity: 'input_text.label_field_' + (i + 1),\n                    name: f[0] + (f[1] ? ' *' : ''),\n   \
          \               }));\n                  if (sch.i) rows.push({ entity: 'input_select.label_icon', name: 'icon' });\n                  return rows;\n                })() }"
    - type: markdown
      content: '{% set icon_templates = ["kitchen/pantry_jar", "garden/seed_packet", "garden/plant_tag", "garden/row_marker", "networking/patch_port", "networking/rack_unit", "networking/wap_location",
        "workshop/hazard", "workshop/tool_id", "workshop/torque_cal", "workshop/first_aid", "home_inventory/moving_box", "home_inventory/warranty", "home_inventory/storage_bin", "media/bookshelf_tag", "media/archive_box",
        "media/cd_record", "pet/collar_backup", "pet/med_schedule", "pet/food_bowl", "travel/luggage_tag", "travel/gear_bag", "travel/power_bank", "calibration/instrument_cal", "calibration/cert_id", "calibration/thermometer_cal"]
        %}

        {% set icon = states(''input_select.label_icon'') %}

        {% if states(''input_select.label_template'') in icon_templates and icon not in [''(none)'', '''', ''unknown'', ''unavailable''] %}

        **Icon:** <img src="https://brother-ptouch-automation.spencerslab.com/icons/{{ icon }}.svg" width="48" alt="{{ icon }}" style="vertical-align: middle"> {{ icon }}

        {% endif %}'
    - type: entities
      title: Advanced
      entities:
      - entity: input_text.label_extra_fields
        name: Extra fields (JSON)
    - type: markdown
      content: '`Extra fields` takes an optional JSON object (max 255 chars) merged in last, e.g. `{"wire": "red"}` — needed only for `electronics/cable_flag`''s overflow fields.'
  - type: grid
    cards:
    - type: heading
      heading: Preview
      icon: mdi:image-search-outline
    - type: markdown
      content: '{% if states(''input_text.label_preview_token'') not in ['''', ''unknown'', ''unavailable''] %}

        ![Label preview](/local/labels/preview.png?v={{ states(''input_text.label_preview_token'') }})

        {% else %}

        No preview yet — fill in the options and click **Preview Label**.

        {% endif %}

        {% set r = states(''input_text.label_last_result'') %}

        {% if r not in ['''', ''unknown'', ''unavailable''] %}


        **Last result:** {{ r }}

        {% endif %}'
    - type: entities
      title: Tape
      entities:
      - entity: input_select.label_tape_mm
        name: Tape width (mm, synced from printer on preview)
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: Preview Label
        icon: mdi:image-search
        tap_action:
          action: perform-action
          perform_action: script.label_preview_from_helpers
      - type: button
        name: Send to Printer
        icon: mdi:printer
        tap_action:
          action: perform-action
          perform_action: script.label_print_from_helpers
          confirmation:
            text: Send this label to the printer?
      - type: button
        name: Reset
        icon: mdi:restore
        tap_action:
          action: perform-action
          perform_action: script.label_reset_helpers
          confirmation:
            text: Reset all label fields to defaults?
  - type: grid
    cards:
    - type: heading
      heading: Icon picker
      icon: mdi:emoticon-outline
      heading_style: subtitle
    - type: custom:config-template-card
      entities:
      - input_select.label_icon
      card:
        type: grid
        columns: 8
        square: true
        cards: "${ [\"antenna\", \"apple\", \"arrow-right\", \"arrow-up-right\", \"banana\", \"barcode\", \"battery\", \"beef\", \"biohazard\", \"bluetooth\", \"book\", \"bookmark\", \"box\", \"briefcase\"\
          , \"cable\", \"calendar\", \"carrot\", \"cat\", \"check\", \"chef-hat\", \"cherry\", \"circle\", \"clipboard-check\", \"clock\", \"coffee\", \"cog\", \"compass\", \"cookie\", \"cpu\", \"croissant\"\
          , \"dog\", \"drill\", \"droplets\", \"egg\", \"file-text\", \"fish\", \"flame\", \"flower-2\", \"gauge\", \"globe\", \"grape\", \"hammer\", \"hard-drive\", \"heart\", \"info\", \"key\", \"leaf\"\
          , \"lock\", \"luggage\", \"map\", \"map-pin\", \"milk\", \"monitor\", \"network\", \"package\", \"paintbrush\", \"paw-print\", \"pill\", \"plane\", \"plug\", \"printer\", \"qr-code\", \"router\"\
          , \"ruler\", \"salad\", \"scale\", \"scissors\", \"server\", \"server-cog\", \"shield\", \"signal\", \"snowflake\", \"sprout\", \"square\", \"star\", \"sun\", \"syringe\", \"tag\", \"tent\", \"\
          thermometer\", \"tree-pine\", \"triangle\", \"usb\", \"utensils\", \"wheat\", \"wifi\", \"wrench\", \"x\", \"zap\"].map(n => ({\n                    type: 'picture',\n                    image:\
          \ 'https://brother-ptouch-automation.spencerslab.com/icons/' + n + '.svg',\n                    tap_action: {\n                      action: 'perform-action',\n                      perform_action:\
          \ 'input_select.select_option',\n                      target: { entity_id: 'input_select.label_icon' },\n                      data: { option: n },\n                    },\n                 \
          \ })) }"
